        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalError'
  /api/v1/ducklings/{instance}/start:
    post:
      tags:
        - DucklingService
      summary: Start a duckling instance
      operationId: startDucklingInstance
      parameters:
        - name: instance
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: No privilege
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalError'
  /api/v1/duck-lakes:
    get:
      tags:
        - DuckLakeService
      summary: List Duck Lake
      operationId: listDuckLake
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuckLake'
        '400':
          description: ''
          content:
