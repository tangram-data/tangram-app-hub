openapi: 3.0.3
info:
  title: Google Sheets
  version: "1.0"
  description: Subset of the Google Sheets API v4 exposed through the Tangram connector.
servers:
  - url: https://sheets.googleapis.com

paths:
  /v4/spreadsheets:
    post:
      operationId: createSpreadsheet
      summary: Create a new spreadsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
                  properties:
                    title:
                      type: string
                      description: Title of the new spreadsheet.
      responses:
        "200":
          description: The created spreadsheet with its spreadsheetId and spreadsheetUrl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spreadsheet"

  /v4/spreadsheets/{spreadsheetId}:
    get:
      operationId: getSpreadsheet
      summary: Fetch spreadsheet metadata
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          description: The spreadsheet id from its URL.
          schema:
            type: string
        - name: includeGridData
          in: query
          required: false
          description: Set true to include cell data (large; prefer getValues for ranges).
          schema:
            type: boolean
      responses:
        "200":
          description: Spreadsheet metadata including sheets and their gridProperties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spreadsheet"
        "404":
          description: Spreadsheet not found.

  /v4/spreadsheets/{spreadsheetId}/values/{range}:
    get:
      operationId: getValues
      summary: Read cell values from a range
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          description: A1-notation range, e.g. Sheet1!A1:D10.
          schema:
            type: string
        - name: majorDimension
          in: query
          required: false
          schema:
            type: string
            enum: [ROWS, COLUMNS]
        - name: valueRenderOption
          in: query
          required: false
          schema:
            type: string
            enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
      responses:
        "200":
          description: The values in the range as a 2-D array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueRange"
    put:
      operationId: updateValues
      summary: Overwrite cell values in a range
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          description: A1-notation range to overwrite.
          schema:
            type: string
        - name: valueInputOption
          in: query
          required: true
          description: RAW stores values as-is; USER_ENTERED parses them as if typed (formulas, dates).
          schema:
            type: string
            enum: [RAW, USER_ENTERED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueRange"
      responses:
        "200":
          description: Update summary (updatedRows, updatedColumns, updatedCells).
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedRange:
                    type: string
                  updatedRows:
                    type: integer
                  updatedColumns:
                    type: integer
                  updatedCells:
                    type: integer

  /v4/spreadsheets/{spreadsheetId}/values/{range}:append:
    post:
      operationId: appendValues
      summary: Append rows after a table
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          description: A1-notation range identifying the table to append to (e.g. Sheet1!A1).
          schema:
            type: string
        - name: valueInputOption
          in: query
          required: true
          schema:
            type: string
            enum: [RAW, USER_ENTERED]
        - name: insertDataOption
          in: query
          required: false
          description: INSERT_ROWS inserts new rows; OVERWRITE writes over existing empty cells.
          schema:
            type: string
            enum: [INSERT_ROWS, OVERWRITE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueRange"
      responses:
        "200":
          description: Append result with the updated range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tableRange:
                    type: string
                  updates:
                    type: object

components:
  schemas:
    Spreadsheet:
      type: object
      properties:
        spreadsheetId:
          type: string
        spreadsheetUrl:
          type: string
        properties:
          type: object
          properties:
            title:
              type: string
        sheets:
          type: array
          items:
            type: object
            properties:
              properties:
                type: object
                properties:
                  sheetId:
                    type: integer
                  title:
                    type: string
                  gridProperties:
                    type: object
    ValueRange:
      type: object
      properties:
        range:
          type: string
        majorDimension:
          type: string
        values:
          type: array
          description: 2-D array of cell values, outer array = rows.
          items:
            type: array
            items: {}
