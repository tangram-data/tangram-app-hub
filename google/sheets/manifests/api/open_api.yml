openapi: 3.0.3
info:
  title: Google Sheets
  version: "1.0"
  description: Subset of the Google Sheets API v4 exposed through the Tangram connector.
servers:
  - url: https://sheets.googleapis.com

paths:
  /v4/spreadsheets:
    post:
      operationId: createSpreadsheet
      summary: Create a new spreadsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
                  properties:
                    title:
                      type: string
                      description: Title of the new spreadsheet.
      responses:
        "200":
          description: The created spreadsheet with its spreadsheetId and spreadsheetUrl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spreadsheet"

  /v4/spreadsheets/{spreadsheetId}:
    get:
      operationId: getSpreadsheet
      summary: Fetch spreadsheet metadata
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          description: The spreadsheet id from its URL.
          schema:
            type: string
        - name: includeGridData
          in: query
          required: false
          description: Set true to include cell data (large; prefer getValues for ranges).
          schema:
            type: boolean
        - name: fields
          in: query
          required: false
          description: >
            Optional response field mask to trim the payload, e.g.
            spreadsheetId,properties(title),sheets(properties(sheetId,title,gridProperties)).
            Omit for all metadata.
          schema:
            type: string
      responses:
        "200":
          description: Spreadsheet metadata including sheets and their gridProperties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spreadsheet"
        "404":
          description: Spreadsheet not found.

  /v4/spreadsheets/{spreadsheetId}:batchUpdate:
    post:
      operationId: batchUpdateSpreadsheet
      summary: Apply structural or formatting changes to a spreadsheet
      description: >
        Applies a list of Sheets API Request objects atomically (all succeed or none).
        Each item has exactly one key naming the request kind, e.g.
        {"addSheet": {"properties": {"title": "Q3"}}},
        {"deleteSheet": {"sheetId": 123}},
        {"updateSheetProperties": {"properties": {"sheetId": 0, "title": "Summary"}, "fields": "title"}},
        {"repeatCell": {...}}, {"autoResizeDimensions": {...}}. sheetId values come from getSpreadsheet.
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  description: Sheets API Request objects, applied in order.
                  items:
                    type: object
                    additionalProperties: true
                includeSpreadsheetInResponse:
                  type: boolean
                  description: Return the updated spreadsheet metadata in updatedSpreadsheet.
      responses:
        "200":
          description: One reply per request (e.g. addSheet returns the new sheet's properties).
          content:
            application/json:
              schema:
                type: object
                properties:
                  spreadsheetId:
                    type: string
                  replies:
                    type: array
                    items:
                      type: object
                  updatedSpreadsheet:
                    $ref: "#/components/schemas/Spreadsheet"
        "400":
          description: Invalid request (e.g. duplicate sheet title, unknown sheetId).

  /v4/spreadsheets/{spreadsheetId}/values:batchGet:
    get:
      operationId: batchGetValues
      summary: Read cell values from several ranges in one call
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: ranges
          in: query
          required: true
          description: A1-notation ranges, e.g. ["Sheet1!A1:D10", "Summary!B2:B5"].
          schema:
            type: array
            minItems: 1
            items:
              type: string
        - name: majorDimension
          in: query
          required: false
          schema:
            type: string
            enum: [ROWS, COLUMNS]
        - name: valueRenderOption
          in: query
          required: false
          schema:
            type: string
            enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
      responses:
        "200":
          description: One ValueRange per requested range, in request order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spreadsheetId:
                    type: string
                  valueRanges:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValueRange"

  /v4/spreadsheets/{spreadsheetId}/values/{range}:
    get:
      operationId: getValues
      summary: Read cell values from a range
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          description: A1-notation range, e.g. Sheet1!A1:D10.
          schema:
            type: string
        - name: majorDimension
          in: query
          required: false
          schema:
            type: string
            enum: [ROWS, COLUMNS]
        - name: valueRenderOption
          in: query
          required: false
          schema:
            type: string
            enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
      responses:
        "200":
          description: The values in the range as a 2-D array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueRange"
    put:
      operationId: updateValues
      summary: Overwrite cell values in a range
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          description: A1-notation range to overwrite.
          schema:
            type: string
        - name: valueInputOption
          in: query
          required: true
          description: RAW stores values as-is; USER_ENTERED parses them as if typed (formulas, dates).
          schema:
            type: string
            enum: [RAW, USER_ENTERED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueRange"
      responses:
        "200":
          description: Update summary (updatedRows, updatedColumns, updatedCells).
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedRange:
                    type: string
                  updatedRows:
                    type: integer
                  updatedColumns:
                    type: integer
                  updatedCells:
                    type: integer

  /v4/spreadsheets/{spreadsheetId}/values/{range}:append:
    post:
      operationId: appendValues
      summary: Append rows after a table
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          description: A1-notation range identifying the table to append to (e.g. Sheet1!A1).
          schema:
            type: string
        - name: valueInputOption
          in: query
          required: true
          schema:
            type: string
            enum: [RAW, USER_ENTERED]
        - name: insertDataOption
          in: query
          required: false
          description: INSERT_ROWS inserts new rows; OVERWRITE writes over existing empty cells.
          schema:
            type: string
            enum: [INSERT_ROWS, OVERWRITE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueRange"
      responses:
        "200":
          description: Append result with the updated range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tableRange:
                    type: string
                  updates:
                    type: object

  /v4/spreadsheets/{spreadsheetId}/values/{range}:clear:
    post:
      operationId: clearValues
      summary: Clear cell values in a range
      description: Removes values only; formatting, data validation, and notes are kept.
      parameters:
        - name: spreadsheetId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: path
          required: true
          description: A1-notation range to clear, e.g. Sheet1!A2:D100.
          schema:
            type: string
      responses:
        "200":
          description: The range that was cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spreadsheetId:
                    type: string
                  clearedRange:
                    type: string

components:
  schemas:
    Spreadsheet:
      type: object
      properties:
        spreadsheetId:
          type: string
        spreadsheetUrl:
          type: string
        properties:
          type: object
          properties:
            title:
              type: string
        sheets:
          type: array
          items:
            type: object
            properties:
              properties:
                type: object
                properties:
                  sheetId:
                    type: integer
                  title:
                    type: string
                  gridProperties:
                    type: object
    ValueRange:
      type: object
      properties:
        range:
          type: string
        majorDimension:
          type: string
        values:
          type: array
          description: 2-D array of cell values, outer array = rows.
          items:
            type: array
            items: {}
