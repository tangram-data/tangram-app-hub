openapi: 3.0.3
info:
  title: Google Drive
  version: "1.0"
  description: >
    Subset of the Google Drive API v3 exposed through the Tangram connector:
    file discovery, metadata, download/export, copy, and sharing.
servers:
  - url: https://www.googleapis.com

paths:
  /drive/v3/files:
    get:
      operationId: listFiles
      summary: List or search files
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Drive search query. Common filters: name contains 'budget',
            fullText contains 'roadmap', mimeType='application/vnd.google-apps.spreadsheet'
            (spreadsheets), ...google-apps.document (docs),
            ...google-apps.presentation (slides), modifiedTime > '2026-01-01T00:00:00',
            'folderId' in parents, trashed=false. Combine with and/or.
          schema:
            type: string
        - name: orderBy
          in: query
          required: false
          description: Sort keys, e.g. modifiedTime desc, name.
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: Files per page (default 100, max 1000).
          schema:
            type: integer
        - name: pageToken
          in: query
          required: false
          description: Page token from a previous listFiles response.
          schema:
            type: string
        - name: fields
          in: query
          required: false
          description: >
            Response field mask. Defaults to the recommended
            nextPageToken,files(id,name,mimeType,size,modifiedTime,owners,parents,webViewLink);
            without it Drive returns only id, name, and mimeType. Pass a custom mask
            to request other fields.
          schema:
            type: string
            default: "nextPageToken,files(id,name,mimeType,size,modifiedTime,owners,parents,webViewLink)"
        - name: includeItemsFromAllDrives
          in: query
          required: false
          description: Set true (with supportsAllDrives=true) to include shared-drive files.
          schema:
            type: boolean
        - name: supportsAllDrives
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Matching files with a nextPageToken when more results exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
                  nextPageToken:
                    type: string
        "401":
          description: Unauthorized (token expired or revoked).

  /drive/v3/files/{fileId}:
    get:
      operationId: getFile
      summary: Fetch file metadata by id
      parameters:
        - name: fileId
          in: path
          required: true
          description: The file id (from listFiles or a Drive URL).
          schema:
            type: string
        - name: fields
          in: query
          required: false
          description: >
            Field mask. Defaults to the recommended
            id,name,mimeType,size,modifiedTime,owners,parents,webViewLink; without it
            Drive returns only id, name, and mimeType. Use * for every field.
          schema:
            type: string
            default: "id,name,mimeType,size,modifiedTime,owners,parents,webViewLink"
        - name: supportsAllDrives
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The file's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          description: File not found.

  /drive/v3/files/{fileId}/export:
    get:
      operationId: exportFile
      summary: Export a Google Workspace document's content
      parameters:
        - name: fileId
          in: path
          required: true
          description: Id of a Google Docs, Sheets, or Slides file (not binary uploads).
          schema:
            type: string
        - name: mimeType
          in: query
          required: true
          description: >
            Target format. Docs: text/plain, text/markdown, application/pdf.
            Sheets: text/csv (first sheet), application/pdf. Slides: text/plain,
            application/pdf. Export is capped at 10 MB.
          schema:
            type: string
      responses:
        "200":
          description: The exported file content in the requested format.
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Unsupported export mimeType for this file.

  /download/drive/v3/files/{fileId}:
    get:
      operationId: downloadFile
      summary: Download a binary file's content
      description: >
        Media download for uploaded (non-Workspace) files such as PDFs, images, and
        Office files; the content is saved to a workspace file and returned as a file
        reference. Google Docs/Sheets/Slides cannot be downloaded — use exportFile.
      parameters:
        - name: fileId
          in: path
          required: true
          description: Id of an uploaded file (mimeType not application/vnd.google-apps.*).
          schema:
            type: string
        - name: alt
          in: query
          required: false
          description: Always media (returns the file bytes instead of metadata).
          schema:
            type: string
            enum: [media]
            default: media
        - name: acknowledgeAbuse
          in: query
          required: false
          description: Set true to download a file Drive flagged as malware/abusive (owner-acknowledged risk).
          schema:
            type: boolean
        - name: supportsAllDrives
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Workspace document (use exportFile) or download not permitted.
        "404":
          description: File not found.

  /drive/v3/files/{fileId}/copy:
    post:
      operationId: copyFile
      summary: Copy a file
      parameters:
        - name: fileId
          in: path
          required: true
          description: The file to copy (folders cannot be copied).
          schema:
            type: string
        - name: fields
          in: query
          required: false
          description: Response field mask for the new file.
          schema:
            type: string
            default: "id,name,mimeType,parents,webViewLink"
        - name: supportsAllDrives
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the copy (default "Copy of <original name>").
                parents:
                  type: array
                  description: Single destination folder id (default the original's folder).
                  maxItems: 1
                  items:
                    type: string
                description:
                  type: string
      responses:
        "200":
          description: The new file's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          description: File not found.

  /drive/v3/files/{fileId}/permissions:
    post:
      operationId: createPermission
      summary: Share a file or folder
      parameters:
        - name: fileId
          in: path
          required: true
          description: The file or folder to share.
          schema:
            type: string
        - name: sendNotificationEmail
          in: query
          required: false
          description: >
            Email the grantee about the share (Drive default true for user/group
            grants). Set false to share silently.
          schema:
            type: boolean
        - name: emailMessage
          in: query
          required: false
          description: Plain-text note included in the notification email.
          schema:
            type: string
        - name: supportsAllDrives
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, type]
              properties:
                role:
                  type: string
                  description: Access level. Ownership transfer is not supported here.
                  enum: [reader, commenter, writer, fileOrganizer, organizer]
                type:
                  type: string
                  description: >
                    user or group (needs emailAddress), domain (needs domain), or
                    anyone (anyone with the link).
                  enum: [user, group, domain, anyone]
                emailAddress:
                  type: string
                  description: Grantee email for type user or group.
                domain:
                  type: string
                  description: Grantee domain for type domain, e.g. example.com.
                allowFileDiscovery:
                  type: boolean
                  description: For domain/anyone, whether the file shows up in search (default false = link only).
      responses:
        "200":
          description: The created permission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  role:
                    type: string
                  emailAddress:
                    type: string
                  domain:
                    type: string
        "400":
          description: Invalid grantee/role combination.
        "404":
          description: File not found.

  /drive/v3/about:
    get:
      operationId: getAbout
      summary: Fetch the connected account and its storage quota
      parameters:
        - name: fields
          in: query
          required: false
          description: Field mask (required by Drive). Defaults to user,storageQuota.
          schema:
            type: string
            default: "user,storageQuota"
      responses:
        "200":
          description: The account's user info and storage quota.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      displayName:
                        type: string
                      emailAddress:
                        type: string
                  storageQuota:
                    type: object
                    description: limit, usage, usageInDrive, usageInDriveTrash (byte counts as strings).

components:
  schemas:
    File:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
          description: application/vnd.google-apps.* for native Workspace types.
        modifiedTime:
          type: string
        size:
          type: string
          description: Bytes, absent for native Workspace documents.
        owners:
          type: array
          items:
            type: object
            properties:
              displayName:
                type: string
              emailAddress:
                type: string
        webViewLink:
          type: string
          description: Browser URL for opening the file.
        parents:
          type: array
          items:
            type: string
