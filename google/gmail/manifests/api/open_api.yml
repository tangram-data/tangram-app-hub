openapi: 3.0.3
info:
  title: Gmail
  version: "1.0"
  description: >
    Subset of the Gmail API v1 exposed through the Tangram connector. All
    operations act on the connected account (users/me).
servers:
  - url: https://gmail.googleapis.com

paths:
  /gmail/v1/users/me/messages:
    get:
      operationId: listMessages
      x-tangram-search:
        hits: {items: messages, id: id}
      summary: Search messages in the connected mailbox
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Gmail search query, same syntax as the Gmail search box
            (e.g. "from:alice@example.com is:unread newer_than:7d").
          schema:
            type: string
        - name: labelIds
          in: query
          required: false
          description: >
            Only return messages carrying ALL of these label ids (e.g. INBOX, UNREAD).
            For anything more complex (OR, negation, sender, dates, attachments) use
            the `q` search query instead (e.g. "in:inbox -label:promotions has:attachment").
          schema:
            type: array
            items:
              type: string
        - name: maxResults
          in: query
          required: false
          description: Maximum messages to return (default 100, max 500).
          schema:
            type: integer
        - name: pageToken
          in: query
          required: false
          description: Page token from a previous listMessages response.
          schema:
            type: string
      responses:
        "200":
          description: Matching message ids with a nextPageToken when more results exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        threadId:
                          type: string
                  nextPageToken:
                    type: string
                  resultSizeEstimate:
                    type: integer
        "401":
          description: Unauthorized (token expired or revoked).

  /gmail/v1/users/me/messages/{id}:
    get:
      operationId: getMessage
      summary: Fetch one message by id
      description: >
        With format=full the response adds decoded.text / decoded.html (the
        message's plain-text and HTML bodies, decoded, up to 64K chars each) —
        read those instead of the base64url payload parts.
      x-tangram-response-adapter:
        name: mime-text-parts
      # the message as a document (knowledge): its decoded plain-text body
      x-tangram-agent-view:
        markdown:
          text: decoded.text
      parameters:
        - name: id
          in: path
          required: true
          description: The message id returned by listMessages.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: full (default), metadata, minimal, or raw.
          schema:
            type: string
            enum: [full, metadata, minimal, raw]
        - name: metadataHeaders
          in: query
          required: false
          description: >
            With format=metadata, only return these headers (e.g. ["From", "To", "Subject", "Date"]).
            Ignored for other formats.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: The message with headers, labels, and payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found.

  /gmail/v1/users/me/messages/{id}/modify:
    post:
      operationId: modifyMessage
      summary: Add or remove labels on a message
      description: >
        Mark read = removeLabelIds ["UNREAD"]; mark unread = addLabelIds ["UNREAD"];
        archive = removeLabelIds ["INBOX"]; star = addLabelIds ["STARRED"].
        User label ids come from listLabels.
      parameters:
        - name: id
          in: path
          required: true
          description: The message id returned by listMessages.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addLabelIds:
                  type: array
                  description: Label ids to add (max 100).
                  items:
                    type: string
                removeLabelIds:
                  type: array
                  description: Label ids to remove (max 100).
                  items:
                    type: string
      responses:
        "200":
          description: The message with its updated labelIds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found.

  /gmail/v1/users/me/messages/{id}/trash:
    post:
      operationId: trashMessage
      summary: Move a message to the trash
      description: >
        Trashed messages are deleted permanently by Gmail after 30 days; until then
        the user can restore them from Trash.
      parameters:
        - name: id
          in: path
          required: true
          description: The message id returned by listMessages.
          schema:
            type: string
      responses:
        "200":
          description: The trashed message (labelIds now include TRASH).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found.

  /gmail/v1/users/me/threads:
    get:
      operationId: listThreads
      summary: Search conversation threads in the connected mailbox
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Gmail search query, same syntax as the Gmail search box
            (e.g. "from:alice@example.com is:unread newer_than:7d").
          schema:
            type: string
        - name: labelIds
          in: query
          required: false
          description: Only return threads with messages carrying ALL of these label ids (e.g. INBOX, UNREAD).
          schema:
            type: array
            items:
              type: string
        - name: maxResults
          in: query
          required: false
          description: Maximum threads to return (default 100, max 500).
          schema:
            type: integer
        - name: pageToken
          in: query
          required: false
          description: Page token from a previous listThreads response.
          schema:
            type: string
      responses:
        "200":
          description: Matching thread ids and snippets with a nextPageToken when more results exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        snippet:
                          type: string
                        historyId:
                          type: string
                  nextPageToken:
                    type: string
                  resultSizeEstimate:
                    type: integer
        "401":
          description: Unauthorized (token expired or revoked).

  /gmail/v1/users/me/threads/{id}:
    get:
      operationId: getThread
      summary: Fetch a whole conversation thread by id
      description: >
        Returns every message in the thread. Bodies are NOT decoded here: they are
        base64url under messages[].payload. Use format=metadata to skim a thread, then
        getMessage on one message id to read its decoded body.
      parameters:
        - name: id
          in: path
          required: true
          description: The thread id (threadId from listMessages or listThreads).
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: full (default), metadata, or minimal.
          schema:
            type: string
            enum: [full, metadata, minimal]
        - name: metadataHeaders
          in: query
          required: false
          description: >
            With format=metadata, only return these headers (e.g. ["From", "To", "Subject", "Date"]).
            Ignored for other formats.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: The thread with its messages in chronological order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  snippet:
                    type: string
                  historyId:
                    type: string
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "404":
          description: Thread not found.

  /gmail/v1/users/me/messages/send:
    post:
      operationId: sendMessage
      summary: Send an email as the connected account
      x-tangram-request-adapter:
        name: rfc822-base64url
        targetPath: raw
        copy:
          threadId: threadId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: The sent message (id, threadId, labelIds).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid raw message.

  /gmail/v1/users/me/messages/{messageId}/attachments/{attachmentId}:
    get:
      operationId: getAttachment
      summary: Fetch an attachment's content by id
      description: >
        Returns the attachment bytes as base64url (not standard base64) in `data`.
        Responses can be very large (roughly 4/3 of the file size); check the part's
        body.size from getMessage first and avoid fetching big files unnecessarily.
      parameters:
        - name: messageId
          in: path
          required: true
          description: The message the attachment belongs to.
          schema:
            type: string
        - name: attachmentId
          in: path
          required: true
          description: The attachmentId from the message part's body.attachmentId.
          schema:
            type: string
      responses:
        "200":
          description: The attachment bytes, base64url-encoded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  size:
                    type: integer
                  data:
                    type: string
                    description: base64url-encoded file content.
        "404":
          description: Attachment not found.

  /gmail/v1/users/me/drafts:
    get:
      operationId: listDrafts
      summary: List drafts in the mailbox
      parameters:
        - name: q
          in: query
          required: false
          description: Only return drafts matching this Gmail search query (e.g. "to:bob@example.com").
          schema:
            type: string
        - name: maxResults
          in: query
          required: false
          description: Maximum drafts to return (default 100, max 500).
          schema:
            type: integer
        - name: pageToken
          in: query
          required: false
          description: Page token from a previous listDrafts response.
          schema:
            type: string
      responses:
        "200":
          description: Draft ids with their message id/threadId, and a nextPageToken when more exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  drafts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        message:
                          type: object
                          properties:
                            id:
                              type: string
                            threadId:
                              type: string
                  nextPageToken:
                    type: string
                  resultSizeEstimate:
                    type: integer
    post:
      operationId: createDraft
      summary: Create a draft without sending it
      x-tangram-request-adapter:
        name: rfc822-base64url
        targetPath: message.raw
        copy:
          threadId: message.threadId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: The created draft with its id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    $ref: "#/components/schemas/Message"

  /gmail/v1/users/me/drafts/send:
    post:
      operationId: sendDraft
      summary: Send an existing draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: The draft id from createDraft or listDrafts.
      responses:
        "200":
          description: The sent message (id, threadId, labelIds).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Draft not found.

  /gmail/v1/users/me/profile:
    get:
      operationId: getProfile
      summary: Fetch the connected account's mailbox profile
      responses:
        "200":
          description: The account's email address and mailbox counters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailAddress:
                    type: string
                  messagesTotal:
                    type: integer
                  threadsTotal:
                    type: integer
                  historyId:
                    type: string

  /gmail/v1/users/me/labels:
    get:
      operationId: listLabels
      summary: List all labels in the mailbox
      responses:
        "200":
          description: System and user labels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string

components:
  schemas:
    EmailRequest:
      type: object
      required: [to]
      properties:
        to:
          type: array
          minItems: 1
          items:
            type: string
          description: Recipient addresses. Each item may include a display name.
        cc:
          type: array
          items:
            type: string
          description: Carbon-copy recipient addresses.
        bcc:
          type: array
          items:
            type: string
          description: Blind-carbon-copy recipient addresses.
        replyTo:
          type: array
          items:
            type: string
          description: Reply-To addresses, when different from the connected account.
        subject:
          type: string
          default: ""
        text:
          type: string
          default: ""
          description: Plain-text message body.
        html:
          type: string
          description: Optional HTML alternative. When present, text remains the plain-text fallback.
        threadId:
          type: string
          description: Set to reply or draft within an existing Gmail thread.
        inReplyTo:
          type: string
          description: >
            When replying, the parent's Message-ID header (e.g. "<abc@mail.gmail.com>").
            Required with threadId so recipients' clients thread the reply; also
            keep the parent's Subject (prefixed "Re:").
        references:
          type: string
          description: >
            When replying, the parent's References header followed by its
            Message-ID, space-separated.
        attachments:
          type: array
          description: Attachments whose content is standard base64 (not base64url).
          items:
            type: object
            required: [filename, contentBase64]
            properties:
              filename:
                type: string
              contentType:
                type: string
                default: application/octet-stream
              contentBase64:
                type: string
                format: byte

    Message:
      type: object
      properties:
        id:
          type: string
        threadId:
          type: string
        labelIds:
          type: array
          items:
            type: string
        snippet:
          type: string
          description: Short plain-text preview of the message.
        payload:
          type: object
          description: MIME tree with headers and base64url-encoded body parts.
        internalDate:
          type: string
          description: Epoch millis when the message was received.
