components:
  schemas:
    Dataset:
      type: object
      properties:
        name:
          type: string
          description: "The name of the dataset. E.g., 'my.uc.table@2', 'nyc-taxi-dataset', 'fantastic-elk-3'. This field is required."
        digest:
          type: string
          description: "Dataset digest, e.g., an md5 hash of the dataset that uniquely identifies it within datasets of the same name. This field is required."
        source_type:
          type: string
          description: "The type of the dataset source, e.g., 'databricks-uc-table', 'DBFS', 'S3'. This field is required."
        source:
          type: string
          description: "Source information for the dataset. Note that the source may not exactly reproduce the dataset if it was transformed/modified before use with MLflow. This field is required."
        schema:
          type: string
          description: "The schema of the dataset. E.g., MLflow ColSpec JSON for a dataframe, MLflow TensorSpec JSON for an ndarray, or another schema format."
        profile:
          type: string
          description: "The profile of the dataset. Summary statistics for the dataset, such as the number of rows in a table, the mean/std/mode of each column in a table, or the number of elements in an array."

    DatasetInput:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/InputTag'
          description: "A list of tags for the dataset input, e.g., a 'context' tag with value 'training'."
        dataset:
          $ref: '#/components/schemas/Dataset'
          description: "The dataset being used as a Run input. This field is required."

    Experiment:
      type: object
      properties:
        experiment_id:
          type: string
        name:
          type: string
        artifact_location:
          type: string
        lifecycle_stage:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        creation_time:
          type: integer
        last_update_time:
          type: integer
        description:
          type: string

    Run:
      type: object
      properties:
        info:
          $ref: '#/components/schemas/RunInfo'
        data:
          $ref: '#/components/schemas/RunData'

    RunInfo:
      type: object
      properties:
        run_id:
          type: string
        experiment_id:
          type: string
        user_id:
          type: string
        status:
          type: string
        start_time:
          type: integer
        end_time:
          type: integer
        lifecycle_stage:
          type: string
        artifact_uri:
          type: string
        run_name:
          type: string

    RunData:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        tags:
          type: array
          items:
