openapi: 3.1.0
info:
  title: MLflow REST API
  version: 1.0.0
paths:
  /api/2.0/mlflow/experiments/create:
    post:
      tags:
        - Experiments
      summary: Create Experiment
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                artifact_location:
                  type: string
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment_id:
