openapi: 3.0.3
info:
  title: Kafka Service
  version: 1.0.0
paths:
  /api/v1/clusters:
    post:
      operationId: initializeKafkaCluster
      tags: [KafkaService]
      summary: >-
        Initialize the workspace's single Kafka cluster (KRaft, Strimzi-managed) in the app's
        namespace asynchronously; poll GET /clusters/{name} for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeClusterRequest'
      responses:
        '200':
          description: Cluster record in status Creating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaClusterInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}:
    get:
      operationId: getKafkaCluster
      tags: [KafkaService]
      summary: Get Kafka cluster by name, including its lifecycle status.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Cluster or null when not found
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/KafkaClusterInfo'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKafkaCluster
      tags: [KafkaService]
      summary: >-
        Decommission a Kafka cluster asynchronously (topics, users, node pools, brokers and their
        disks are garbage-collected by the operator).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Deletion started
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/scale:
    post:
      operationId: scaleKafkaCluster
      tags: [KafkaService]
      summary: Update the broker replica count (scale-down requires Cruise Control).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleClusterRequest'
      responses:
        '200':
          description: Scale applied; the operator rolls it out
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/resources:
    post:
      operationId: configureKafkaCluster
      tags: [KafkaService]
      summary: Update per-pod resources of both node pools and the broker replica count.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourcesRequest'
      responses:
        '200':
          description: Resource update applied; the operator rolls it out
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/endpoints:
    get:
      operationId: getKafkaClusterEndpoints
      tags: [KafkaService]
      summary: Internal and external bootstrap servers of the cluster.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Bootstrap endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterEndpoints'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/connection-details:
    get:
      operationId: getKafkaClusterConnectionDetails
      tags: [KafkaService]
      summary: Token-lane connection coordinates (GetConnectionDetails action); never credentials.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Token-lane bootstrap, token endpoint and schema-registry URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConnectionDetails'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances:
    get:
      operationId: getKafkaClusterInstances
      tags: [KafkaService]
      summary: Status of the cluster's controller, broker and entity-operator pods.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Pod statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterInstance'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances/{pod}/logs:
    get:
      operationId: getKafkaClusterInstanceLogs
      tags: [KafkaService]
      summary: Tail of one pod's logs (default 500 lines, capped at 5000).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - name: pod
          in: path
          required: true
          schema:
            type: string
        - name: tailLines
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Log tail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceLogs'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/ops-actions:
    get:
      operationId: listKafkaClusterOpsActions
      tags: [KafkaService]
      summary: "Open ops actions of the cluster: problems that need a person, whether the fix is safe now."
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Open and in-progress ops actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpsAction'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/ops-actions/{id}/execute:
    post:
      operationId: executeKafkaClusterOpsAction
      tags: [KafkaService]
      summary: >-
        Run an ops action's fix (e.g. rebuild a broker stuck on a lost node). Re-checks safety; `confirm` must
        equal the action's typed confirmation value.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteOpsActionRequest'
      responses:
        '200':
          description: The action, now in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsAction'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics:
    post:
      operationId: createKafkaTopic
      tags: [KafkaService]
      summary: >-
        Create a topic (KafkaTopic CR, reconciled by the Topic Operator) with a declared value
        format; an Avro topic's schema is registered in the schema registry and the catalog.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicRequest'
      responses:
        '200':
          description: Topic record (reconciliation pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicInfo'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listKafkaTopics
      tags: [KafkaService]
      summary: List the cluster's topics with their reconciliation state.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}:
    get:
      operationId: getKafkaTopic
      tags: [KafkaService]
      summary: Describe one topic (partitions, replicas, config, readiness).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      responses:
        '200':
          description: Topic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicInfo'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: updateKafkaTopic
      tags: [KafkaService]
      summary: Update a topic's partition count (grow-only) and/or config.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicRequest'
      responses:
        '200':
          description: Updated topic record (reconciliation pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicInfo'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKafkaTopic
      tags: [KafkaService]
      summary: Delete a topic and its data.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      responses:
        '200':
          description: Topic deletion requested
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}/schema:
    post:
      operationId: setKafkaTopicSchema
      tags: [KafkaService]
      summary: >-
        Create or update the topic's schema: an Avro schema (registered in the cluster's schema
        registry under `<topic>-value` and flattened into the core data catalog) or plain
        flattened fields (catalog-only, for schemaless-JSON topics).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTopicSchemaRequest'
      responses:
        '200':
          description: Registered schema with its catalog version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicSchemaInfo'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: getKafkaTopicSchema
      tags: [KafkaService]
      summary: Latest registered Tangram schema of the topic.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      responses:
        '200':
          description: Latest schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicSchemaInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}/messages/batch:
    post:
      operationId: produceKafkaTopicMessagesBatch
      tags: [KafkaService]
      summary: >-
        High-frequency ingestion: post up to 1000 messages in one call over a shared producer,
        each encoded per the topic's declared format. One authorization check per batch; the
        action skips per-call audit.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduceMessagesBatchRequest'
      responses:
        '200':
          description: Batch outcome with per-message failures by request index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceMessagesBatchResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}/ingestion-keys:
    post:
      operationId: createKafkaIngestionKey
      tags: [KafkaService]
      summary: >-
        Create a write-only ingestion key for the public ingest endpoint
        (POST /api/v1/ingest/{cluster}/{topic}, exposed directly to browsers, never through the
        platform gateway). The plaintext key is returned once and never stored.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                allowedOrigins:
                  type: array
                  items: { type: string }
                  description: >-
                    Optional website-origin allowlist (scheme://host[:port], at most 20).
                    When set, ingest requests must carry a matching Origin header; empty/absent
                    falls back to the app's ingestAllowedOrigins setting, else any origin.
      responses:
        '200':
          description: The created key (only time the secret is visible)
          content:
            application/json:
              schema:
                type: object
                required: [id, name, topic, key, allowedOrigins]
                properties:
                  id: { type: string }
                  name: { type: string }
                  topic: { type: string }
                  key: { type: string }
                  allowedOrigins:
                    type: array
                    items: { type: string }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listKafkaIngestionKeys
      tags: [KafkaService]
      summary: List the topic's ingestion keys (metadata only).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, topic, createdAt, allowedOrigins]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    topic: { type: string }
                    createdAt: { type: string, format: date-time }
                    revokedAt: { type: string, format: date-time, nullable: true }
                    allowedOrigins:
                      type: array
                      items: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/ingestion-keys/{keyId}:
    delete:
      operationId: revokeKafkaIngestionKey
      tags: [KafkaService]
      summary: Revoke an ingestion key (takes effect within the verification cache TTL).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}/stats:
    get:
      operationId: getKafkaTopicStats
      tags: [KafkaService]
      summary: >-
        Live per-partition offsets, retained-record estimate and log sizes, fetched from the
        brokers.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      responses:
        '200':
          description: Per-partition stats with topic totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicStats'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}/sample:
    get:
      operationId: getKafkaTopicSample
      tags: [KafkaService]
      summary: The topic's newest record (any partition), or null when it is empty.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      responses:
        '200':
          description: Newest record
          content:
            application/json:
              schema:
                type: object
                nullable: true
                required: [partition, offset, timestamp]
                properties:
                  partition: {type: integer}
                  offset: {type: integer, format: int64}
                  timestamp: {type: integer, format: int64}
                  key: {type: string, nullable: true}
                  value:
                    description: The record value when it is JSON text.
                    nullable: true
                  rawValue: {type: string, nullable: true}
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}/downstream:
    get:
      operationId: listKafkaTopicDownstream
      tags: [KafkaService]
      summary: Datasets fed from the topic, with the columns derived from each topic field (core lineage).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      responses:
        '200':
          description: Downstream datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicDownstream'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/ingest-settings:
    get:
      operationId: getKafkaIngestSettings
      tags: [KafkaService]
      summary: App-wide public ingest settings (default browser-origin allowlist; empty = any origin).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Ingest settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestSettings'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/topics/{topic}/messages:
    post:
      operationId: produceKafkaTopicMessage
      tags: [KafkaService]
      summary: >-
        Post a single message to the topic (admin producer, internal listener), encoded per the
        topic's declared format: JSON verbatim, text as a raw string, or Avro transformed against
        the topic's registered schema (Confluent-framed).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/TopicName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduceMessageRequest'
      responses:
        '200':
          description: Broker acknowledgement metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceMessageResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/sink-connectors:
    post:
      operationId: createKafkaSinkConnector
      tags: [KafkaService]
      summary: >-
        Create a sink connector job: a managed Kafka Connect pipeline consuming the topics as a
        per-job IAM service account — the integrated Iceberg sink or a custom connector class. A
        user-supplied customImage MUST be one you built or fully trust — it runs inside the app
        namespace with access to the job's credentials.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSinkConnectorRequest'
      responses:
        '200':
          description: Sink record in status Creating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkConnectorInfo'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listKafkaSinkConnectors
      tags: [KafkaService]
      summary: List the cluster's Iceberg sink jobs with their live Connect state.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Sink jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SinkConnectorInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/sink-connectors/{sink}:
    get:
      operationId: getKafkaSinkConnector
      tags: [KafkaService]
      summary: Describe one sink connector job, including its connector tasks.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SinkName'
      responses:
        '200':
          description: Sink job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkConnectorInfo'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKafkaSinkConnector
      tags: [KafkaService]
      summary: >-
        Delete the sink job asynchronously: its Connect resources, secrets, per-job service account
        and internal topics. Already-delivered data is kept.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SinkName'
      responses:
        '200':
          description: Deletion started
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/sink-connectors/{sink}/instances:
    get:
      operationId: getKafkaSinkConnectorInstances
      tags: [KafkaService]
      summary: Status of the sink's Connect worker pods.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SinkName'
      responses:
        '200':
          description: Worker pod statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterInstance'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/sink-connectors/{sink}/instances/{pod}/logs:
    get:
      operationId: getKafkaSinkConnectorInstanceLogs
      tags: [KafkaService]
      summary: Tail of one Connect worker pod's logs (default 500 lines, capped at 5000).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SinkName'
        - name: pod
          in: path
          required: true
          schema:
            type: string
        - name: tailLines
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Log tail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceLogs'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/sink-connectors/{sink}/pause:
    post:
      operationId: pauseKafkaSinkConnector
      tags: [KafkaService]
      summary: Pause the sink's connector (consumption and commits stop; state is kept).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SinkName'
      responses:
        '200':
          description: Sink job after the pause
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkConnectorInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/sink-connectors/{sink}/resume:
    post:
      operationId: resumeKafkaSinkConnector
      tags: [KafkaService]
      summary: Resume a paused sink connector.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SinkName'
      responses:
        '200':
          description: Sink job after the resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkConnectorInfo'
        default:
          $ref: '#/components/responses/Error'
  # Confluent-wire-compatible Avro schema registry (per cluster). The same endpoints are served
  # unwrapped for in-cluster Confluent clients (serializers, Connect converters) whose
  # schema.registry.url points at the service; this spec exposes the curated management subset.
  /api/v1/clusters/{name}/schema-registry/subjects:
    get:
      operationId: listKafkaSchemaSubjects
      tags: [KafkaService]
      summary: List the cluster's schema registry subjects.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Subject names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        default:
          $ref: '#/components/responses/SchemaRegistryError'
  /api/v1/clusters/{name}/schema-registry/subjects/{subject}/versions:
    post:
      operationId: registerKafkaSchema
      tags: [KafkaService]
      summary: >-
        Register an Avro schema under the subject (Confluent semantics: idempotent for an
        already-registered schema, otherwise appends the next version after a compatibility
        check against the subject's history).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SubjectName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSchemaRequest'
      responses:
        '200':
          description: Global id of the registered schema
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer }
        default:
          $ref: '#/components/responses/SchemaRegistryError'
    get:
      operationId: listKafkaSchemaVersions
      tags: [KafkaService]
      summary: List the subject's registered schema versions.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SubjectName'
      responses:
        '200':
          description: Version numbers, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { type: integer }
        default:
          $ref: '#/components/responses/SchemaRegistryError'
  /api/v1/clusters/{name}/schema-registry/subjects/{subject}/versions/{version}:
    get:
      operationId: getKafkaSchemaVersion
      tags: [KafkaService]
      summary: One registered schema version of the subject (a version number or `latest`).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/SubjectName'
        - $ref: '#/components/parameters/SchemaVersion'
      responses:
        '200':
          description: The registered schema at that version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVersionInfo'
        default:
          $ref: '#/components/responses/SchemaRegistryError'
  /api/v1/clusters/{name}/schema-registry/config:
    get:
      operationId: getKafkaSchemaCompatibility
      tags: [KafkaService]
      summary: The cluster registry's schema compatibility level.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Current compatibility level
          content:
            application/json:
              schema:
                type: object
                required: [compatibilityLevel]
                properties:
                  compatibilityLevel: { type: string }
        default:
          $ref: '#/components/responses/SchemaRegistryError'
    put:
      operationId: setKafkaSchemaCompatibility
      tags: [KafkaService]
      summary: >-
        Set the registry's compatibility level (NONE, BACKWARD, BACKWARD_TRANSITIVE, FORWARD,
        FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compatibility]
              properties:
                compatibility: { type: string }
      responses:
        '200':
          description: The applied compatibility level
          content:
            application/json:
              schema:
                type: object
                required: [compatibility]
                properties:
                  compatibility: { type: string }
        default:
          $ref: '#/components/responses/SchemaRegistryError'
components:
  parameters:
    ClusterName:
      name: name
      in: path
      required: true
      schema:
        type: string
    TopicName:
      name: topic
      in: path
      required: true
      schema:
        type: string
    SinkName:
      name: sink
      in: path
      required: true
      schema:
        type: string
    SubjectName:
      name: subject
      in: path
      required: true
      schema:
        type: string
    SchemaVersion:
      name: version
      in: path
      required: true
      description: A positive version number or the literal `latest`.
      schema:
        type: string
  responses:
    # Platform convention (same as the other app packages): Tapir serializes ServiceError to a
    # plain string body on the error channel.
    Error:
      description: Service error
      content:
        application/json:
          schema: { type: string }
    # The schema-registry routes speak the Confluent wire format, errors included.
    SchemaRegistryError:
      description: Confluent-style registry error
      content:
        application/json:
          schema:
            type: object
            required: [error_code, message]
            properties:
              error_code: { type: integer }
              message: { type: string }
  schemas:
    ExecuteOpsActionRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: The action's typed confirmation value (the pod name).
    OpsAction:
      type: object
      required: [id, kind, severity, scope, title, detail, evidence, resolution, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        severity: { type: string, enum: [critical, warning, info] }
        scope:
          type: object
          required: [type]
          properties:
            type: { type: string }
            appGroup: { type: string, nullable: true }
            appName: { type: string, nullable: true }
            resource: { type: string, nullable: true }
        title: { type: string }
        detail: { type: string }
        evidence:
          type: object
          additionalProperties: { type: string }
        resolution:
          type: object
          required: [action, label, safeNow, executor]
          properties:
            action: { type: string }
            label: { type: string }
            safeNow: { type: boolean }
            blockedReason: { type: string, nullable: true }
            confirm:
              type: object
              nullable: true
              required: [type, value]
              properties:
                type: { type: string }
                value: { type: string }
            executor: { type: string }
            link: { type: string, nullable: true }
        status: { type: string, enum: [open, in_progress, resolved] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    ComponentSpec:
      type: object
      required: [replicas, cpuMilli, memoryMi]
      properties:
        replicas:
          type: integer
        cpuMilli:
          type: integer
        memoryMi:
          type: integer
    RegisterSchemaRequest:
      type: object
      required: [schema]
      properties:
        schema:
          type: string
          description: The Avro schema as a JSON string.
        schemaType:
          type: string
          description: Optional; must be AVRO when present (the only supported type).
    SchemaVersionInfo:
      type: object
      required: [subject, id, version, schema]
      properties:
        subject:
          type: string
        id:
          type: integer
        version:
          type: integer
        schema:
          type: string
    InitializeClusterRequest:
      type: object
      required: [controllers, brokers]
      properties:
        controllers:
          allOf:
            - $ref: '#/components/schemas/ComponentSpec'
          description: Controller node pool sizing; replicas must be 1 or 3 (KRaft quorum).
        brokers:
          allOf:
            - $ref: '#/components/schemas/ComponentSpec'
          description: Broker node pool sizing.
        controllerDiskGb:
          type: integer
          nullable: true
          description: Per-controller persistent disk (default 10 GiB); immutable after creation.
        brokerDiskGb:
          type: integer
          nullable: true
          description: Per-broker persistent disk (default 100 GiB); immutable after creation.
        kafkaVersion:
          type: string
          nullable: true
          description: Kafka version handed to Strimzi; omitted = operator default.
        exposeExternalListener:
          type: boolean
          default: false
          description: Expose an external SCRAM listener via LoadBalancer (port 9094).
        enableCruiseControl:
          type: boolean
          default: false
          description: >-
            Deploy Cruise Control with auto-rebalance on broker scale events. Required for broker
            scale-down. Set at creation.
    KafkaClusterSpec:
      type: object
      required: [name, controllers, brokers, controllerDiskGb, brokerDiskGb, exposeExternalListener]
      properties:
        name:
          type: string
        kafkaVersion:
          type: string
          nullable: true
        controllers:
          $ref: '#/components/schemas/ComponentSpec'
        brokers:
          $ref: '#/components/schemas/ComponentSpec'
        controllerDiskGb:
          type: integer
        brokerDiskGb:
          type: integer
        exposeExternalListener:
          type: boolean
        enableCruiseControl:
          type: boolean
    KafkaClusterInfo:
      type: object
      required: [name, workspace, spec, status, createdAt]
      properties:
        name:
          type: string
        workspace:
          type: string
        spec:
          $ref: '#/components/schemas/KafkaClusterSpec'
        status:
          type: string
          enum:
            - Creating
            - InstallingOperator
            - DeployingKafka
            - Active
            - Degraded
            - CreationFailed
            - Deleting
            - DeletionFailed
        statusMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        runtimeKafkaVersion:
          type: string
          nullable: true
          description: >-
            The Kafka version the cluster actually runs (operator-reported); spec.kafkaVersion is
            null when the operator default is used.
    ScaleClusterRequest:
      type: object
      required: [brokerReplicas]
      properties:
        brokerReplicas:
          type: integer
    UpdateResourcesRequest:
      type: object
      required: [controllers, brokers]
      properties:
        controllers:
          allOf:
            - $ref: '#/components/schemas/ComponentSpec'
          description: Controller replicas are immutable; only cpu/memory may change.
        brokers:
          $ref: '#/components/schemas/ComponentSpec'
    ClusterEndpoints:
      type: object
      properties:
        internalBootstrap:
          type: string
          nullable: true
          description: In-cluster bootstrap for the SCRAM-authenticated internal listener (port 9092).
        externalBootstrap:
          type: string
          nullable: true
          description: LoadBalancer bootstrap of the external listener, when exposed and assigned.
        tokenBootstrap:
          type: string
          nullable: true
          description: >-
            In-cluster bootstrap of the Tangram-token listener (port 9095, SASL/OAUTHBEARER,
            IAM-authorized); null when the token lane is not enabled.
        tokenEndpointUrl:
          type: string
          nullable: true
          description: >-
            Namespace-qualified OAuth client_credentials token endpoint for OIDC consumers
            (e.g. StarRocks routine loads): a Tangram service-account token is presented as
            client_secret and returned as the access token.
        schemaRegistryUrl:
          type: string
          nullable: true
          description: >-
            Namespace-qualified base URL of the cluster's Confluent-compatible schema registry
            (token-authenticated: Bearer, or Basic with a Tangram token as the password).
    ClusterConnectionDetails:
      type: object
      required: [bootstrapServers, securityProtocol, saslMechanism, tokenEndpointUrl]
      description: >-
        Token-lane connection coordinates — never credentials: clients authenticate with their
        own Tangram token (OAUTHBEARER OIDC client_credentials with the token as client_secret),
        and topic access is authorized by Tangram IAM.
      properties:
        bootstrapServers:
          type: string
          description: In-cluster bootstrap of the Tangram-token listener.
        securityProtocol:
          type: string
          description: SASL_PLAINTEXT
        saslMechanism:
          type: string
          description: OAUTHBEARER
        tokenEndpointUrl:
          type: string
          description: OAuth client_credentials endpoint accepting a Tangram token as client_secret.
        schemaRegistryUrl:
          type: string
          nullable: true
          description: Confluent-compatible schema registry base URL (token-authenticated).
        status:
          type: string
          nullable: true
          description: Cluster lifecycle status at fetch time.
    ClusterInstance:
      type: object
      required: [name, role, phase, ready, restarts]
      properties:
        name:
          type: string
        role:
          type: string
          description: controller | broker | entity-operator
        phase:
          type: string
        ready:
          type: boolean
        restarts:
          type: integer
        startedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true
          description: Waiting reason (e.g. CrashLoopBackOff).
    InstanceLogs:
      type: object
      required: [pod, log]
      properties:
        pod:
          type: string
        log:
          type: string
    CreateTopicRequest:
      type: object
      required: [name, partitions]
      properties:
        name:
          type: string
          description: Kafka topic name (1-249 chars of [a-zA-Z0-9._-]).
        partitions:
          type: integer
        replicas:
          type: integer
          nullable: true
          description: Defaults to the cluster's default replication factor.
        config:
          type: object
          additionalProperties:
            type: string
          description: Raw topic configs (e.g. retention.ms).
        format:
          type: string
          enum: [Text, Json, Avro]
          default: Json
          description: >-
            Declared value encoding, set at creation and immutable. Governs the produce
            endpoint's transformation and sink converter defaults (a contract for the platform's
            lanes, not a broker-enforced guarantee).
        avroSchema:
          type: string
          nullable: true
          description: >-
            Required when format is Avro; registered as the topic's schema (schema registry +
            catalog).
    UpdateTopicRequest:
      type: object
      properties:
        partitions:
          type: integer
          nullable: true
          description: New partition count; can only grow.
        config:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Full replacement config; omitted keeps the current config.
    TopicInfo:
      type: object
      required: [name, config, ready]
      properties:
        name:
          type: string
        partitions:
          type: integer
          nullable: true
        replicas:
          type: integer
          nullable: true
        config:
          type: object
          additionalProperties:
            type: string
        ready:
          type: boolean
        message:
          type: string
          nullable: true
        format:
          type: string
          enum: [Text, Json, Avro]
          default: Json
    TopicSchemaField:
      type: object
      required: [name, dataType]
      properties:
        name:
          type: string
        dataType:
          type: string
          description: Logical field type (e.g. string, long, double, boolean, timestamp, json).
        nullable:
          type: boolean
          default: true
        doc:
          type: string
          nullable: true
    SetTopicSchemaRequest:
      type: object
      description: >-
        Exactly one input lane: an Avro record schema (registered in the cluster's schema
        registry under `<topic>-value` and flattened into the catalog fields), or plain
        flattened fields (catalog-only, for schemaless-JSON topics).
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TopicSchemaField'
          description: Field names must be unique; order becomes the catalog field ordering.
        avroSchema:
          type: string
          nullable: true
          description: Avro record schema as a JSON string; mutually exclusive with fields.
    TopicSchemaInfo:
      type: object
      required: [topic, version, fields]
      properties:
        topic:
          type: string
        version:
          type: integer
          description: Dataset schema version in the core data catalog (0 for the first registration).
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TopicSchemaField'
        avroSchema:
          type: string
          nullable: true
          description: The topic's latest registered Avro schema (subject `<topic>-value`), when one exists.
    ProduceMessagesBatchRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProduceMessageRequest'
    ProduceMessagesBatchResult:
      type: object
      required: [topic, produced]
      properties:
        topic:
          type: string
        produced:
          type: integer
        partitions:
          type: array
          description: Per-partition summary (offsets are partition-local).
          items:
            type: object
            required: [partition, count, lastOffset]
            properties:
              partition: { type: integer }
              count: { type: integer }
              lastOffset:
                type: integer
                format: int64
        failures:
          type: array
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer }
              error: { type: string }
    ProduceMessageRequest:
      type: object
      required: [value]
      properties:
        value:
          description: Arbitrary JSON message body, produced verbatim to the topic.
        key:
          type: string
          nullable: true
          description: Optional record key (determines the partition).
        headers:
          type: object
          additionalProperties:
            type: string
          description: Optional Kafka record headers.
    TopicPartitionStats:
      type: object
      required: [partition, replicas, inSyncReplicas, earliestOffset, latestOffset, messageEstimate]
      properties:
        partition:
          type: integer
        leader:
          type: integer
          nullable: true
          description: Broker id of the partition leader; null while leaderless.
        replicas:
          type: integer
        inSyncReplicas:
          type: integer
        earliestOffset:
          type: integer
          format: int64
        latestOffset:
          type: integer
          format: int64
        messageEstimate:
          type: integer
          format: int64
          description: >-
            latestOffset - earliestOffset: upper bound on retained records (deletion and compaction
            shrink the real count below it).
        leaderSizeBytes:
          type: integer
          format: int64
          nullable: true
          description: On-disk log size of the leader replica.
    TopicSample:
      type: object
      required: [partition, offset, timestamp]
      properties:
        partition: {type: integer}
        offset: {type: integer, format: int64}
        timestamp: {type: integer, format: int64}
        key: {type: string, nullable: true}
        value:
          description: The record value when it is JSON text.
          nullable: true
        rawValue: {type: string, nullable: true}
    TopicDownstream:
      type: object
      required: [resource, app, resourceType, names]
      properties:
        resource: {type: string}
        app: {type: string}
        resourceType: {type: string}
        names:
          type: array
          items: {type: string}
        columns:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        processor: {type: string, nullable: true}
    IngestSettings:
      type: object
      properties:
        allowedOrigins:
          type: array
          items: {type: string}
    TopicStats:
      type: object
      required: [topic, partitions, totalMessageEstimate, totalLeaderSizeBytes, totalReplicatedSizeBytes]
      properties:
        topic:
          type: string
        partitions:
          type: array
          items:
            $ref: '#/components/schemas/TopicPartitionStats'
        totalMessageEstimate:
          type: integer
          format: int64
        totalLeaderSizeBytes:
          type: integer
          format: int64
          description: Logical topic size (leader replicas only).
        totalReplicatedSizeBytes:
          type: integer
          format: int64
          description: Full on-disk footprint across all replicas.
    ProduceMessageResult:
      type: object
      required: [topic, partition, offset, timestampMs]
      properties:
        topic:
          type: string
        partition:
          type: integer
        offset:
          type: integer
          format: int64
        timestampMs:
          type: integer
          format: int64
          description: Broker append timestamp; -1 when the broker did not report one.
    RegistryCredential:
      type: object
      required: [server, username, password]
      description: >-
        Registry credential for pulling a private custom worker image. Written to a pull secret;
        never persisted in the sink's spec.
      properties:
        server:
          type: string
        username:
          type: string
        password:
          type: string
    SinkCustomImage:
      type: object
      required: [image]
      description: >-
        A user-supplied Connect worker image replacing the Tangram-built default. WARNING — trust
        required: the image runs inside the Kafka app's namespace with access to the worker's
        credentials and the sink job's service-account token. Only use images you built or fully
        trust; Tangram cannot verify their contents.
      properties:
        image:
          type: string
        registryCredential:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RegistryCredential'
    IcebergSinkKind:
      type: object
      required: [type, icebergDatabase, icebergTable]
      description: >-
        The platform-integrated Apache Iceberg sink: commits the topics into a table of the
        workspace's Tangram Iceberg catalog as the job's service account (which is also granted
        the Iceberg database/table roles).
      properties:
        type:
          type: string
          enum: [IcebergSink]
        icebergDatabase:
          type: string
        icebergTable:
          type: string
        autoCreateTable:
          type: boolean
          default: true
        evolveSchema:
          type: boolean
          default: true
        commitIntervalSeconds:
          type: integer
          default: 60
        connectorProps:
          type: object
          additionalProperties:
            type: string
          description: Extra iceberg.* sink options (connection/security keys rejected).
        valueFormat:
          type: string
          enum: [Json, Avro]
          nullable: true
          description: >-
            Record value format. Unset derives from the source topics' declared formats (all
            Avro → Avro, else Json); an explicit value must match them. Avro deserializes
            through the app's built-in schema registry, giving the table typed columns and
            schema evolution.
    CustomSinkKind:
      type: object
      required: [type, connectorClass]
      description: >-
        A user-supplied sink connector class with raw connector config. The class must be present
        in the worker image (usually a custom image); the platform still owns the data-plane
        consumer (token listener, job identity) and the worker's connection settings.
      properties:
        type:
          type: string
          enum: [Custom]
        connectorClass:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: Raw connector config (platform-owned keys and config-provider values rejected).
    SinkConnectorKind:
      oneOf:
        - $ref: '#/components/schemas/IcebergSinkKind'
        - $ref: '#/components/schemas/CustomSinkKind'
      discriminator:
        propertyName: type
        mapping:
          IcebergSink: '#/components/schemas/IcebergSinkKind'
          Custom: '#/components/schemas/CustomSinkKind'
    CreateSinkConnectorRequest:
      type: object
      required: [name, topics, connector]
      properties:
        name:
          type: string
          description: At most 40 chars; lower case letters, digits and dashes.
        topics:
          type: array
          items:
            type: string
          description: Source topics of the managed cluster, consumed as the job's service account.
        connector:
          $ref: '#/components/schemas/SinkConnectorKind'
        tasksMax:
          type: integer
          default: 1
        workers:
          type: integer
          default: 1
          description: Connect worker pods.
        initialOffset:
          type: string
          default: latest
          description: Where a fresh job starts on the topics — latest or earliest.
        cpuMilli:
          type: integer
          default: 500
        memoryMi:
          type: integer
          default: 1024
        customImage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SinkCustomImage'
    SinkConnectorSpec:
      type: object
      required: [name, topics, connector]
      properties:
        name:
          type: string
        topics:
          type: array
          items:
            type: string
        connector:
          $ref: '#/components/schemas/SinkConnectorKind'
        tasksMax:
          type: integer
        workers:
          type: integer
        initialOffset:
          type: string
        cpuMilli:
          type: integer
        memoryMi:
          type: integer
        customImage:
          type: string
          nullable: true
        customImagePullSecret:
          type: boolean
    SinkTaskInfo:
      type: object
      required: [id, state]
      properties:
        id:
          type: integer
        state:
          type: string
        workerId:
          type: string
          nullable: true
        trace:
          type: string
          nullable: true
    SinkConnectorInfo:
      type: object
      required: [name, workspace, cluster, spec, status, createdAt]
      properties:
        name:
          type: string
        workspace:
          type: string
        cluster:
          type: string
        spec:
          $ref: '#/components/schemas/SinkConnectorSpec'
        status:
          type: string
          enum: [Creating, Active, Degraded, CreationFailed, Deleting, DeletionFailed]
        statusMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        connectReady:
          type: boolean
        connectorState:
          type: string
          nullable: true
          description: Live Connect runtime state (RUNNING/PAUSED/FAILED/...) once deployed.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/SinkTaskInfo'
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal provisioning warnings (failed grants, custom-image trust notice).
