openapi: 3.0.3
info:
  title: Stripe API (read-only subset)
  version: "1"
  description: >
    Read-only subset of the Stripe API. Lists return {object: list, data, has_more}; searches return
    {object: search_result, data, has_more, next_page}. Amounts are integers in the smallest currency unit.
servers:
  - url: https://api.stripe.com

paths:
  /v1/balance:
    get:
      operationId: getBalance
      summary: Retrieve the balance
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/customers:
    get:
      operationId: listCustomers
      summary: List customers
      parameters:
        - {name: email, in: query, required: false, description: "Exact email (case-sensitive).", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/customers/search:
    get:
      operationId: searchCustomers
      summary: Search customers
      x-tangram-search:
        queryTemplate: "name~'{query}' OR email~'{query}'"
        hits: {items: data, id: id, title: "name, email"}
        minQueryChars: 3
      parameters:
        - {name: query, in: query, required: true, description: "Stripe search query, e.g. email:'jo@acme.com', name~'acme', metadata['crm_id']:'123'.", schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: page, in: query, required: false, description: next_page of the previous result., schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/customers/{id}:
    get:
      operationId: getCustomer
      summary: Retrieve a customer
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/payment_intents:
    get:
      operationId: listPaymentIntents
      summary: List payment intents
      parameters:
        - {name: customer, in: query, required: false, description: "Customer id (cus_...).", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/payment_intents/search:
    get:
      operationId: searchPaymentIntents
      summary: Search payment intents
      parameters:
        - {name: query, in: query, required: true, description: "Stripe search query, e.g. status:'succeeded' AND amount>10000, customer:'cus_123'.", schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: page, in: query, required: false, description: next_page of the previous result., schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/payment_intents/{id}:
    get:
      operationId: getPaymentIntent
      summary: Retrieve a payment intent
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/charges:
    get:
      operationId: listCharges
      summary: List charges
      parameters:
        - {name: customer, in: query, required: false, description: "Customer id.", schema: {type: string}}
        - {name: payment_intent, in: query, required: false, description: "PaymentIntent id.", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/charges/search:
    get:
      operationId: searchCharges
      summary: Search charges
      parameters:
        - {name: query, in: query, required: true, description: "Stripe search query, e.g. amount>999 AND status:'failed', customer:'cus_123'.", schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: page, in: query, required: false, description: next_page of the previous result., schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/charges/{id}:
    get:
      operationId: getCharge
      summary: Retrieve a charge
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/invoices:
    get:
      operationId: listInvoices
      summary: List invoices
      parameters:
        - {name: customer, in: query, required: false, description: "Customer id.", schema: {type: string}}
        - {name: subscription, in: query, required: false, description: "Subscription id.", schema: {type: string}}
        - {name: status, in: query, required: false, description: "", schema: {type: string, enum: [draft, open, paid, uncollectible, void]}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/invoices/search:
    get:
      operationId: searchInvoices
      summary: Search invoices
      parameters:
        - {name: query, in: query, required: true, description: "Stripe search query, e.g. status:'open' AND total>5000, customer:'cus_123'.", schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: page, in: query, required: false, description: next_page of the previous result., schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      summary: Retrieve a invoice
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions
      parameters:
        - {name: customer, in: query, required: false, description: "Customer id.", schema: {type: string}}
        - {name: price, in: query, required: false, description: "Price id.", schema: {type: string}}
        - {name: status, in: query, required: false, description: "Default excludes canceled; all includes it.", schema: {type: string, enum: [active, past_due, unpaid, canceled, incomplete, incomplete_expired, trialing, paused, all]}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/subscriptions/search:
    get:
      operationId: searchSubscriptions
      summary: Search subscriptions
      parameters:
        - {name: query, in: query, required: true, description: "Stripe search query, e.g. status:'past_due', metadata['plan']:'pro'.", schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: page, in: query, required: false, description: next_page of the previous result., schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: Retrieve a subscription
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/refunds:
    get:
      operationId: listRefunds
      summary: List refunds
      parameters:
        - {name: charge, in: query, required: false, description: "Charge id.", schema: {type: string}}
        - {name: payment_intent, in: query, required: false, description: "PaymentIntent id.", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/refunds/{id}:
    get:
      operationId: getRefund
      summary: Retrieve a refund
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/disputes:
    get:
      operationId: listDisputes
      summary: List disputes
      parameters:
        - {name: charge, in: query, required: false, description: "Charge id.", schema: {type: string}}
        - {name: payment_intent, in: query, required: false, description: "PaymentIntent id.", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/disputes/{id}:
    get:
      operationId: getDispute
      summary: Retrieve a dispute
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/payouts:
    get:
      operationId: listPayouts
      summary: List payouts
      parameters:
        - {name: status, in: query, required: false, description: "", schema: {type: string, enum: [pending, paid, failed, canceled]}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/payouts/{id}:
    get:
      operationId: getPayout
      summary: Retrieve a payout
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/products:
    get:
      operationId: listProducts
      summary: List products
      parameters:
        - {name: active, in: query, required: false, description: "true or false.", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/products/search:
    get:
      operationId: searchProducts
      summary: Search products
      parameters:
        - {name: query, in: query, required: true, description: "Stripe search query, e.g. active:'true' AND name~'pro'.", schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: page, in: query, required: false, description: next_page of the previous result., schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/products/{id}:
    get:
      operationId: getProduct
      summary: Retrieve a product
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/prices:
    get:
      operationId: listPrices
      summary: List prices
      parameters:
        - {name: product, in: query, required: false, description: "Product id.", schema: {type: string}}
        - {name: active, in: query, required: false, description: "true or false.", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/prices/{id}:
    get:
      operationId: getPrice
      summary: Retrieve a price
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

  /v1/balance_transactions:
    get:
      operationId: listBalanceTransactions
      summary: List balance transactions
      parameters:
        - {name: type, in: query, required: false, description: "e.g. charge, refund, payout, adjustment.", schema: {type: string}}
        - {name: payout, in: query, required: false, description: "Only transactions paid out in this payout.", schema: {type: string}}
        - {name: source, in: query, required: false, description: "Source object id.", schema: {type: string}}
        - $ref: "#/components/parameters/createdGte"
        - $ref: "#/components/parameters/createdLte"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/startingAfter"
        - $ref: "#/components/parameters/endingBefore"
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /v1/balance_transactions/{id}:
    get:
      operationId: getBalanceTransaction
      summary: Retrieve a balance transaction
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/expand"
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {description: No such object.}

components:
  parameters:
    limit:
      {name: limit, in: query, required: false, description: "Page size (default 10, max 100).", schema: {type: integer, minimum: 1, maximum: 100}}
    startingAfter:
      {name: starting_after, in: query, required: false, description: Id of the last object of the previous page., schema: {type: string}}
    endingBefore:
      {name: ending_before, in: query, required: false, description: Id of the first object of the next page (paging backwards)., schema: {type: string}}
    createdGte:
      {name: "created[gte]", in: query, required: false, description: Created at or after (UNIX seconds)., schema: {type: integer}}
    createdLte:
      {name: "created[lte]", in: query, required: false, description: Created at or before (UNIX seconds)., schema: {type: integer}}
    expand:
      {name: "expand[]", in: query, required: false, description: "Related objects to inline, e.g. customer, data.customer, latest_invoice.", schema: {type: array, items: {type: string}}}
  responses:
    Ok:
      description: Stripe JSON response.
      content:
        application/json:
          schema:
            type: object
