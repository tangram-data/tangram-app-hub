components:
  schemas:
    AuthenticationError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorType:
          type: string
    BusinessError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorCode:
          type: string
        errorType:
          type: string
    CreateIcebergDB:
      required:
        - db
        - props
      type: object
      properties:
        db:
          type: string
        volume:
          type: string
        props:
          $ref: '#/components/schemas/Map_String'
    CreateIcebergTable:
      required:
        - table
        - schema
        - properties
      type: object
      properties:
        table:
          type: string
        schema:
          type: object
        partitionSpec:
          type: object
        sortOrderSpec:
          type: object
        properties:
          $ref: '#/components/schemas/Map_String'
    ErrorResponseScala:
      required:
        - message
        - type
        - code
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: integer
          format: int32
        stack:
          type: array
          items:
            type: string
    IcebergDB:
      required:
        - volume
        - dir
        - db
        - properties
      type: object
      properties:
        volume:
          type: string
        dir:
          type: string
        db:
          type: string
        properties:
          $ref: '#/components/schemas/Map_String'
    IcebergTable:
      required:
        - db
        - name
        - schema
        - properties
      type: object
      properties:
        db:
          type: string
        name:
          type: string
        schema:
          type: object
        partitionSpec:
          type: object
        sortOrderSpec:
          type: object
        properties:
          $ref: '#/components/schemas/Map_String'
    Map_String:
      type: object
      additionalProperties:
        type: string
    NotFoundError:
      required:
        - resourceType
        - id
        - errorType
      type: object
      properties:
        resourceType:
          type: string
        id:
          type: string
        errorType:
          type: string
    Snapshot:
      required:
        - sequenceNumber
        - snapshotId
        - timestamp
        - summary
        - schemaId
      type: object
      properties:
        sequenceNumber:
          type: integer
          format: int64
        snapshotId:
          type: string
        parentSnapshotId:
          type: string
        timestamp:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/Map_String'
        schemaId:
          type: integer
          format: int32
    Snapshots:
      type: string
      enum:
        - all
        - refs
    TechnicalError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorStack:
          type: string
        errorType:
          type: string
    UnauthorizedError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorType:
          type: string
  securitySchemes:
    httpAuth:
      type: http
      scheme: bearer
