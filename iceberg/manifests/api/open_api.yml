          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseScala'
        '404':
          description: Namespace Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseScala'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseScala'
      security:
        - httpAuth: []
    delete:
      tags:
