openapi: 3.0.3
info:
  title: Sail Service
  version: 1.0.0
paths:
  /api/v1/clusters:
    post:
      operationId: initializeSailCluster
      tags: [SailService]
      summary: >-
        Create a Sail cluster asynchronously; poll GET /clusters/{name} for progress.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Same as the body's `idempotencyKey`; the body wins when both are sent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeClusterRequest'
      responses:
        '200':
          description: Cluster record in status Creating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailClusterInfo'
        '409':
          # the idempotency key was already used with a different request
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listSailClusters
      tags: [SailService]
      summary: List the workspace's Sail clusters.
      responses:
        '200':
          description: Clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SailClusterInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}:
    get:
      operationId: getSailCluster
      tags: [SailService]
      summary: Get the Sail cluster by name, including its lifecycle status (404 when absent).
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Cluster record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailClusterInfo'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSailCluster
      tags: [SailService]
      summary: Decommission the Sail cluster asynchronously (driver, workers, service account, SQL engine).
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Deletion started
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/resources:
    post:
      operationId: configureSailCluster
      tags: [SailService]
      summary: Update driver resources and the worker pool sizing of an active cluster; the driver is rolled.
      parameters:
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourcesRequest'
      responses:
        '200':
          description: Update applied
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/stop:
    post:
      operationId: stopSailCluster
      tags: [SailService]
      summary: Stop the cluster; the driver and its workers stop. Start it again later.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Stopped
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/start:
    post:
      operationId: startSailCluster
      tags: [SailService]
      summary: Start a stopped cluster asynchronously; poll GET /clusters/{name} until Active.
      parameters:
        - $ref: '#/components/parameters/name'
        - name: onlyIfAutoStopped
          in: query
          description: Start only a cluster that auto-stop stopped (the SQL proxy waking an idle cluster).
          schema:
            type: boolean
      responses:
        '200':
          description: Start requested
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/auto-stop:
    post:
      operationId: configureSailClusterAutoStop
      tags: [SailService]
      summary: Turn auto-stop on (idle minutes without worker activity) or off; the driver is not restarted.
      parameters:
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutoStopRequest'
      responses:
        '200':
          description: Auto-stop updated
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/endpoints:
    get:
      operationId: getSailClusterEndpoints
      tags: [SailService]
      summary: Flight SQL endpoint, SQL engine FN and the engine's service account.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterEndpoints'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/connection-details:
    get:
      operationId: getSailClusterConnectionDetails
      tags: [SailService]
      summary: Flight SQL host/port for the SQL proxy (GetConnectionDetails action).
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConnectionDetails'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances:
    get:
      operationId: getSailClusterInstances
      tags: [SailService]
      summary: Status of the cluster's driver and workers.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterInstance'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/worker-exits:
    get:
      operationId: getSailClusterWorkerExits
      tags: [SailService]
      summary: Workers that stopped abnormally (out of memory, crash) in the last 7 days, newest first.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Worker exits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerExit'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances/{pod}/logs:
    get:
      operationId: getSailClusterInstanceLogs
      tags: [SailService]
      summary: Tail of one driver or worker's logs (default 500 lines, capped at 5000).
      parameters:
        - $ref: '#/components/parameters/name'
        - name: pod
          in: path
          required: true
          schema:
            type: string
        - name: tailLines
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Log tail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceLogs'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications:
    post:
      operationId: createSailApplication
      tags: [SailService]
      summary: Create a PySpark application (a Tangram folder for its files and a service account for its runs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SailApplicationSpec'
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailApplication'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listSailApplications
      tags: [SailService]
      summary: List the workspace's PySpark applications.
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SailApplication'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}:
    get:
      operationId: getSailApplication
      tags: [SailService]
      summary: Get an application.
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailApplication'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSailApplication
      tags: [SailService]
      summary: Replace an application's spec (the name is fixed); the next run uses it, active runs keep theirs.
      parameters:
        - $ref: '#/components/parameters/app'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SailApplicationSpec'
      responses:
        '200':
          description: The updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailApplication'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSailApplication
      tags: [SailService]
      summary: Delete an application, its files and its service account (refused while a run is active).
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs:
    get:
      operationId: listSailApplicationLibs
      tags: [SailService]
      summary: All uploaded lib versions of an application.
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: Libs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SailAppLib'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs/{lib}:
    delete:
      operationId: deleteSailApplicationLib
      tags: [SailService]
      summary: Delete every version of a lib.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
      responses:
        '200':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs/{lib}/versions/{version}:
    post:
      operationId: uploadSailApplicationLib
      tags: [SailService]
      summary: Upload a new version of a lib (versions are MAJOR.MINOR.PATCH and only increase).
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
        - $ref: '#/components/parameters/version'
        - name: libType
          in: query
          required: true
          schema:
            type: string
            enum: [PyFile, Wheel, File]
        - name: gitRepo
          in: query
          schema:
            type: string
        - name: gitBranch
          in: query
          schema:
            type: string
        - name: gitCommit
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The stored lib version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailAppLib'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSailApplicationLibVersion
      tags: [SailService]
      summary: Delete one version of a lib.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs/{lib}/versions/{version}/content:
    get:
      operationId: getSailApplicationLibContent
      tags: [SailService]
      summary: A text lib version's content for preview (source and config files up to 16 MiB, first 1 MiB).
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: The file's content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibContent'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs:
    post:
      operationId: runSailApplication
      tags: [SailService]
      summary: Submit a run of the application's latest libs.
      parameters:
        - $ref: '#/components/parameters/app'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: The submitted run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailRun'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listSailApplicationRuns
      tags: [SailService]
      summary: Runs of an application, newest first (default 50).
      parameters:
        - $ref: '#/components/parameters/app'
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SailRun'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/stats:
    get:
      operationId: getSailApplicationRunStats
      tags: [SailService]
      summary: Run counts by status and the latest run's status.
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStats'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}:
    get:
      operationId: getSailApplicationRun
      tags: [SailService]
      summary: Get a run.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SailRun'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}/status:
    get:
      operationId: getSailApplicationRunStatus
      tags: [SailService]
      summary: Status of a run.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatus'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}/cancel:
    post:
      operationId: cancelSailApplicationRun
      tags: [SailService]
      summary: Cancel a pending or running run.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Cancelled
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}/logs:
    get:
      operationId: getSailApplicationRunLogs
      tags: [SailService]
      summary: Logs of a run's driver and workers from the platform log pipeline.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
        - name: component
          in: query
          description: run (the driver) or run-worker
          schema:
            type: string
        - name: startTimestamp
          in: query
          description: epoch seconds
          schema:
            type: integer
            format: int64
        - name: endTimestamp
          in: query
          description: epoch seconds
          schema:
            type: integer
            format: int64
        - name: maxHits
          in: query
          schema:
            type: integer
        - name: errorsOnly
          in: query
          description: only error records, tracebacks and exceptions
          schema:
            type: boolean
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLogs'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    app:
      name: app
      in: path
      required: true
      schema:
        type: string
    lib:
      name: lib
      in: path
      required: true
      schema:
        type: string
    version:
      name: version
      in: path
      required: true
      schema:
        type: string
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Service error
      content:
        application/json:
          schema:
            type: object
  schemas:
    PodResources:
      type: object
      required: [cpuMilli, memoryMi]
      properties:
        cpuMilli:
          type: integer
        memoryMi:
          type: integer
    WorkerSpec:
      type: object
      required: [maxCount, resources]
      properties:
        maxCount:
          type: integer
          description: Maximum workers started on demand; workers are removed when idle.
        resources:
          $ref: '#/components/schemas/PodResources'
        idleSeconds:
          type: integer
          default: 60
        taskSlots:
          type: integer
          default: 8
    SailClusterSpec:
      type: object
      required: [name, driver, worker]
      properties:
        name:
          type: string
        driver:
          $ref: '#/components/schemas/PodResources'
        worker:
          $ref: '#/components/schemas/WorkerSpec'
        autoStop:
          $ref: '#/components/schemas/AutoStopSpec'
        image:
          type: string
          nullable: true
        engine:
          $ref: '#/components/schemas/EngineSpec'
    SailClusterInfo:
      type: object
      required: [name, workspace, spec, status, createdAt]
      properties:
        name:
          type: string
        workspace:
          type: string
        spec:
          $ref: '#/components/schemas/SailClusterSpec'
        status:
          type: string
          enum: [Creating, DeployingSail, Active, Degraded, Stopped, Starting, CreationFailed, Deleting, DeletionFailed]
        statusMessage:
          type: string
          nullable: true
        serviceAccount:
          type: string
          nullable: true
          description: Tangram service account the engine runs as; admins grant it Iceberg data roles.
        sqlEngineFn:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Last activity seen by the manager (Active clusters only).
    InitializeClusterRequest:
      type: object
      required: [name, driver, worker]
      properties:
        name:
          type: string
          description: DNS-1035 label (lowercase, starts with a letter), at most 40 characters, unique in the workspace; must not contain '-driver' or '-worker'.
        driver:
          $ref: '#/components/schemas/PodResources'
        worker:
          $ref: '#/components/schemas/WorkerSpec'
        autoStop:
          $ref: '#/components/schemas/AutoStopSpec'
        idempotencyKey:
          type: string
          description: |
            Makes the create idempotent: a retry with the same key and request returns the same cluster (resuming an
            unfinished or failed create), the same key with a different request or name, or after its cluster was
            deleted, is a 409, and an existing name without that key is a 400 and changes nothing.
    AutoStopSpec:
      type: object
      required: [idleMinutes]
      properties:
        idleMinutes:
          type: integer
          description: Stop the cluster after this many minutes without worker activity (5 to 10080).
    UpdateAutoStopRequest:
      type: object
      properties:
        autoStop:
          allOf:
            - $ref: '#/components/schemas/AutoStopSpec'
          nullable: true
          description: Absent or null turns auto-stop off.
    UpdateResourcesRequest:
      type: object
      required: [driver, worker]
      properties:
        driver:
          $ref: '#/components/schemas/PodResources'
        worker:
          $ref: '#/components/schemas/WorkerSpec'
        engine:
          $ref: '#/components/schemas/EngineSpec'
          description: Absent or null keeps the cluster's engine settings. Applying restarts the driver.
    EngineSpec:
      type: object
      nullable: true
      description: >-
        Engine tuning of a cluster or an application; absent fields use the defaults. Applications freeze it into each
        run at submission; clusters apply it by restarting the driver.
      properties:
        taskMetrics:
          type: boolean
          nullable: true
          description: >-
            Task busy, idle and backpressure times for the Sail UI's Backpressure tab, kept in the driver's memory.
            Absent: on.
        taskMetricsMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
          description: 'How long task metrics are kept; absent: 60.'
        defaultParallelism:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
          description: >-
            Partitions per stage. With workers it must be at most half of max workers × task slots (a shuffle runs two
            stages at once); a quarter fits plans with several stages. Absent: that quarter, or the CPU cores without
            workers.
        shufflePartitions:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
          description: >-
            Applications only: spark.sql.shuffle.partitions of the runs (REPARTITION hints without a count, state
            partitions of new stateful streaming queries; joins and aggregations follow defaultParallelism).
            Absent: 200.
    ClusterEndpoints:
      type: object
      required: [flightSqlPort]
      properties:
        flightSqlHost:
          type: string
          nullable: true
        flightSqlPort:
          type: integer
        sqlEngineFn:
          type: string
          nullable: true
        serviceAccount:
          type: string
          nullable: true
    ClusterConnectionDetails:
      type: object
      required: [host, flightSqlPort, catalog]
      properties:
        host:
          type: string
        flightSqlPort:
          type: integer
        catalog:
          type: string
        status:
          type: string
          nullable: true
        statusMessage:
          type: string
          nullable: true
        autoStopped:
          type: boolean
          description: Stopped for idleness; the SQL proxy starts such a cluster on demand.
        serviceAccountTokenFile:
          type: string
          nullable: true
          description: Path of the cluster's service-account token file; catalogs the SQL proxy attaches use it.
    ClusterInstance:
      type: object
      required: [name, role, phase, ready, restarts]
      properties:
        name:
          type: string
        role:
          type: string
        phase:
          type: string
        ready:
          type: boolean
        restarts:
          type: integer
        startedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true
    WorkerExit:
      type: object
      required: [pod, reason, outOfMemory, finishedAt]
      properties:
        pod:
          type: string
        reason:
          type: string
          description: Container termination reason (OOMKilled, Error) or the pod's (Evicted).
        outOfMemory:
          type: boolean
        exitCode:
          type: integer
          nullable: true
        memoryLimit:
          type: string
          nullable: true
        node:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        finishedAt:
          type: string
          format: date-time
    InstanceLogs:
      type: object
      required: [pod, log]
      properties:
        pod:
          type: string
        log:
          type: string
    LibType:
      type: string
      enum: [PyFile, Wheel, File]
    RunStatus:
      type: string
      enum: [Pending, Running, Succeeded, Failed, Cancelled]
    SailApplicationSpec:
      type: object
      required: [name, mainFile]
      properties:
        name:
          type: string
        mainFile:
          type: string
          description: File name of one of the application's PyFile libs
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        driver:
          $ref: '#/components/schemas/PodResources'
        worker:
          $ref: '#/components/schemas/WorkerSpec'
        maxDurationMinutes:
          type: integer
        description:
          type: string
        streaming:
          type: boolean
          default: false
          description: A long-running streaming job; failures are critical and stall detection / restarts apply.
        notifyOn:
          type: string
          enum: ["off", failures, failures_and_recovery]
          description: >-
            When failed (and stalled) runs open an AI SRE incident on this app; absent = failures.
            failures_and_recovery also resolves it when runs recover.
        failureSeverity:
          type: string
          nullable: true
          enum: [critical, warning]
          description: >-
            Severity of those incidents; absent = critical for streaming, warning for batch. Critical incidents are
            also emailed to Ops admins; Slack gets incidents at or above the workspace's minimum Slack severity.
        stallMinutes:
          type: integer
          description: Streaming only. A running run without driver logs this long is stalled; absent = 10, 0 = never.
        restartOnFailure:
          type: boolean
          default: false
          description: >-
            Resubmit a failed run after 1, 2, 4 ... minutes. For batch jobs, turn on only when a rerun after a partial
            write is safe.
        maxRestarts:
          type: integer
          default: 3
          description: >-
            Most automatic restarts in a row (1-10); a streaming run healthy for 5 minutes, or a run started by hand,
            resets the count.
        serviceAccountToken:
          $ref: '#/components/schemas/ServiceAccountTokenSpec'
        runRetention:
          $ref: '#/components/schemas/RunRetentionSpec'
        stateStore:
          $ref: '#/components/schemas/StateStoreSpec'
        engine:
          $ref: '#/components/schemas/EngineSpec'
    StateStoreSpec:
      type: object
      description: >-
        Streaming only. Where real-time queries keep their state: memory (default) or RocksDB on a node-disk
        scratch volume of the run pod and its workers. The checkpoint stays the durable copy; a restarted run
        reloads its state from there. Micro-batch queries always keep state in memory.
      properties:
        backend:
          type: string
          enum: [memory, rocksdb]
          default: memory
        diskSizeLimitGi:
          type: integer
          minimum: 1
          maximum: 1024
          description: Optional cap of the state disk in GiB; a pod over it is restarted. Absent = the node's free disk.
    RunRetentionSpec:
      type: object
      description: >-
        Finished runs older than retainDays are removed with their Sail UI event logs, except the
        newest keepAtLeast finished runs. Active runs and streaming checkpoint directories are never removed.
      properties:
        retainDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 30
        keepAtLeast:
          type: integer
          minimum: 0
          maximum: 10000
          default: 20
        eventLogHours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 87600
          description: >-
            Sail UI history window: the driver deletes its event log chunks older than this, and the files
            of ended runs once all are older. Absent = 24 for streaming applications, 168 for batch.
        checkpointBatches:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
          description: >-
            Streaming queries keep the checkpoint records (offsets, commits, state) of this many latest
            batches (spark.sql.streaming.minBatchesToRetain). Absent = 100.
    ServiceAccountTokenSpec:
      type: object
      description: >-
        How runs receive the application's service-account token. Omitted, the defaults apply: file
        service-account-token and no env var. Run drivers and workers always get
        TANGRAM_SERVICE_ACCOUNT_TOKEN_FILE with the file's path. The file's token is short-lived and
        renewed during the run; with envVar set the run keeps one token for its whole max duration.
      properties:
        fileName:
          type: string
          default: service-account-token
          description: File name in the run directory /var/run/sail/run/ (letters, digits, '.', '_', '-').
        envVar:
          type: string
          nullable: true
          description: Env var holding the token itself; null for none.
    SailApplication:
      type: object
      required: [name, workspace, spec, folder, createdAt]
      properties:
        name:
          type: string
        workspace:
          type: string
        spec:
          $ref: '#/components/schemas/SailApplicationSpec'
        serviceAccount:
          type: string
        folder:
          type: string
        createdAt:
          type: string
          format: date-time
    LibContent:
      type: object
      required: [content, truncated, sizeBytes]
      properties:
        content:
          type: string
        truncated:
          type: boolean
          description: The file is larger than the 1 MiB preview cap; content is its first part.
        sizeBytes:
          type: integer
          format: int64
    SailAppLib:
      type: object
      required: [name, version, fileName, libType, sizeBytes, createdAt]
      properties:
        name:
          type: string
        version:
          type: string
        fileName:
          type: string
        libType:
          $ref: '#/components/schemas/LibType'
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        gitRepo:
          type: string
        gitBranch:
          type: string
        gitCommit:
          type: string
    RunRequest:
      type: object
      properties:
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        worker:
          $ref: '#/components/schemas/WorkerSpec'
    RunLib:
      type: object
      required: [name, version, fileName, libType]
      properties:
        name:
          type: string
        version:
          type: string
        fileName:
          type: string
        libType:
          $ref: '#/components/schemas/LibType'
    SailRunSpec:
      type: object
      required: [mainFile, args, env, driver, maxDurationMinutes, libs, image]
      properties:
        mainFile:
          type: string
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        driver:
          $ref: '#/components/schemas/PodResources'
        worker:
          $ref: '#/components/schemas/WorkerSpec'
        maxDurationMinutes:
          type: integer
        libs:
          type: array
          items:
            $ref: '#/components/schemas/RunLib'
        image:
          type: string
        streaming:
          type: boolean
        serviceAccountToken:
          $ref: '#/components/schemas/ServiceAccountTokenSpec'
        stateStore:
          $ref: '#/components/schemas/StateStoreSpec'
        eventLogHours:
          type: integer
          nullable: true
          description: Resolved from the application's run retention at submission; absent on older runs.
        checkpointBatches:
          type: integer
          nullable: true
          description: Resolved from the application's run retention at submission; absent on older runs.
        engine:
          $ref: '#/components/schemas/EngineSpec'
    SailRun:
      type: object
      required: [appName, runId, status, spec, submittedAt]
      properties:
        appName:
          type: string
        runId:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        spec:
          $ref: '#/components/schemas/SailRunSpec'
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        statusMessage:
          type: string
        stalledSince:
          type: string
          format: date-time
          description: Running streaming run without driver logs since then.
        restartAttempt:
          type: integer
          description: This run is the n-th automatic restart after a failure.
    RunStats:
      type: object
      required: [counts]
      properties:
        lastRunStatus:
          $ref: '#/components/schemas/RunStatus'
        counts:
          type: object
          additionalProperties:
            type: integer
    RunLogEntry:
      type: object
      required: [log]
      properties:
        timestamp:
          type: integer
          format: int64
        pod:
          type: string
        container:
          type: string
        log:
          type: string
        time:
          type: string
          description: RFC 3339 with sub-second precision (timestamp is epoch seconds)
    RunLogs:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/RunLogEntry'
        before:
          type: integer
          format: int64
          description: Earlier lines exist; the next page ends there (endTimestamp, epoch seconds, exclusive). Lines come oldest first, newest page first.
        partialSecond:
          type: integer
          format: int64
          description: That second (epoch seconds) had too many lines; only its newest are included.
