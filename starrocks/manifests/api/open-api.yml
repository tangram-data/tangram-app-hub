openapi: 3.0.3
info:
  title: StarRocks Service
  version: 1.0.0
paths:
  /api/v1/clusters:
    post:
      operationId: initializeStarRocksCluster
      tags: [StarRocksService]
      summary: >-
        Initialize the workspace's single shared-data StarRocks cluster in the app's k8s cluster
        asynchronously; poll GET /clusters/{name} for progress.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Same as the body's `idempotencyKey`; the body wins when both are sent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeClusterRequest'
      responses:
        '200':
          description: Cluster record in status Creating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarRocksClusterInfo'
        '409':
          # the idempotency key was already used with a different request
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}:
    get:
      operationId: getStarRocksCluster
      tags: [StarRocksService]
      summary: Get StarRocks cluster by name, including its lifecycle status.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Cluster or null when not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarRocksClusterInfo'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteStarRocksCluster
      tags: [StarRocksService]
      summary: >-
        Decommission a StarRocks cluster asynchronously (CR, namespace, provisioned k8s cluster,
        SQL engine).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Deletion started
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/stop:
    post:
      operationId: stopStarRocksCluster
      tags: [StarRocksService]
      summary: >-
        Stop the cluster: compute scales to zero (the FE stays up); SQL connections do not resume
        it until it is started again.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Stopped
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/start:
    post:
      operationId: startStarRocksCluster
      tags: [StarRocksService]
      summary: Start a stopped or idle-suspended cluster; poll GET /clusters/{name} until Active.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Start requested
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/scale:
    post:
      operationId: scaleStarRocksCluster
      tags: [StarRocksService]
      summary: >-
        Update the compute (CN/BE) replica count of an active cluster. Rejected while
        computeAutoscale is set (the HPA owns the count).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleClusterRequest'
      responses:
        '200':
          description: Scaled
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/resources:
    post:
      operationId: configureStarRocksCluster
      tags: [StarRocksService]
      summary: Update the FE and compute (CN/BE) replica counts and per-pod resources of an active cluster.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourcesRequest'
      responses:
        '200':
          description: Updated
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/endpoints:
    get:
      operationId: getStarRocksClusterEndpoints
      tags: [StarRocksService]
      summary: FE MySQL/HTTP endpoints of the cluster and the registered SQL engine FN.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterEndpoints'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/connection-details:
    get:
      operationId: getStarRocksClusterConnectionDetails
      tags: [StarRocksService]
      summary: FE MySQL host/port and root credentials for the SQL proxy (sensitive).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConnectionDetails'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/engine-catalogs:
    post:
      operationId: ensureStarRocksEngineCatalog
      tags: [StarRocksService]
      summary: Create or repair the cluster's long-lived Iceberg catalog (Tangram SQL proxy only).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureEngineCatalogRequest'
      responses:
        '200':
          description: The physical catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineCatalog'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances:
    get:
      operationId: getStarRocksClusterInstances
      tags: [StarRocksService]
      summary: Status of the cluster's FE and compute (CN/BE) pods.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterInstance'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances/{pod}/logs:
    get:
      operationId: getStarRocksClusterInstanceLogs
      tags: [StarRocksService]
      summary: Tail of one FE/CN/BE pod's logs (default 500 lines, capped at 5000).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - name: pod
          in: path
          required: true
          schema: { type: string }
        - name: tailLines
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Log tail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceLogs'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases:
    get:
      operationId: listStarRocksDatabases
      tags: [StarRocksService]
      summary: List the cluster's user databases (default catalog).
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarRocksDatabaseList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases/{database}/tables:
    get:
      operationId: listStarRocksTables
      tags: [StarRocksService]
      summary: List the database's tables.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarRocksTableList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases/{database}/tables/{table}/schema:
    get:
      operationId: describeStarRocksTable
      tags: [StarRocksService]
      summary: The table's columns (DESC), for the routine-load column-mapping form.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
        - name: table
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Table columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarRocksTableSchema'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/tangram-kafka/topics:
    get:
      operationId: listStarRocksTangramKafkaTopics
      tags: [StarRocksService]
      summary: Topics of the workspace's Tangram-managed Kafka, for the routine-load source picker.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Tangram Kafka topics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TangramKafkaTopicList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/routine-loads:
    get:
      operationId: listAllStarRocksRoutineLoads
      tags: [StarRocksService]
      summary: List routine load jobs across all databases of the cluster.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Routine load jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineLoadList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases/{database}/routine-loads:
    post:
      operationId: createStarRocksRoutineLoad
      tags: [StarRocksService]
      summary: >-
        Create a routine load job that continuously ingests a Kafka topic into a table; the server
        renders and executes the CREATE ROUTINE LOAD statement.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineLoadRequest'
      responses:
        '200':
          description: Created routine load job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineLoadInfo'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listStarRocksRoutineLoads
      tags: [StarRocksService]
      summary: List the database's routine load jobs with state, progress and statistics.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Routine load jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineLoadList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases/{database}/routine-loads/preview:
    post:
      operationId: previewStarRocksRoutineLoad
      tags: [StarRocksService]
      summary: Render the CREATE ROUTINE LOAD statement for the request without executing it.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineLoadRequest'
      responses:
        '200':
          description: Rendered SQL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineLoadSqlPreview'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases/{database}/routine-loads/{job}:
    get:
      operationId: getStarRocksRoutineLoad
      tags: [StarRocksService]
      summary: Get one routine load job, including progress, statistics and error diagnostics.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: Routine load job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineLoadInfo'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: stopStarRocksRoutineLoad
      tags: [StarRocksService]
      summary: Stop the routine load job permanently (STOP ROUTINE LOAD); it cannot be resumed.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: Stopped
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases/{database}/routine-loads/{job}/pause:
    post:
      operationId: pauseStarRocksRoutineLoad
      tags: [StarRocksService]
      summary: Pause the routine load job; resume continues from the recorded offsets.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: Paused routine load job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineLoadInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/databases/{database}/routine-loads/{job}/resume:
    post:
      operationId: resumeStarRocksRoutineLoad
      tags: [StarRocksService]
      summary: Resume a paused routine load job from its recorded offsets.
      parameters:
        - $ref: '#/components/parameters/ClusterName'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: Resumed routine load job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineLoadInfo'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    ClusterName:
      name: name
      in: path
      required: true
      schema: { type: string }
    DatabaseName:
      name: database
      in: path
      required: true
      schema: { type: string }
    JobName:
      name: job
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Service error
      content:
        application/json:
          schema: { type: string }
  schemas:
    ComponentSpec:
      type: object
      required: [replicas, cpuMilli, memoryMi]
      properties:
        replicas: { type: integer }
        cpuMilli: { type: integer }
        memoryMi: { type: integer }
    ComputeSpecRequest:
      type: object
      description: >-
        Compute sizing as supplied by clients. replicas may be omitted (or null) when
        computeAutoscale is set — the HPA owns the count and the autoscale minimum becomes the
        stored fallback; without autoscaling it is required and must be >= 1.
      required: [cpuMilli, memoryMi]
      properties:
        replicas: { type: integer, nullable: true }
        cpuMilli: { type: integer }
        memoryMi: { type: integer }
    ComputeAutoscaleSpec:
      type: object
      description: >-
        HPA-driven autoscaling of the compute tier (shared-data only). Scale-to-zero is not
        supported: minReplicas must be >= 1. While set, the compute replica count is HPA-owned and
        the scale endpoint is rejected.
      required: [minReplicas, maxReplicas, targetCpuPercent]
      properties:
        minReplicas: { type: integer, minimum: 1 }
        maxReplicas: { type: integer, minimum: 1 }
        targetCpuPercent: { type: integer, minimum: 1, maximum: 100 }
    StorageSpec:
      type: object
      description: >-
        Resolved by the service from the app's provisioned bucket (random per-cluster prefix);
        ignored on input, present on output for shared-data clusters.
      required: [volumeType, bucket]
      properties:
        volumeType:
          type: string
          enum: [S3, AZBLOB, ADLS2]
        bucket: { type: string }
        prefix: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        region: { type: string, nullable: true }
        pathStyleAccess: { type: boolean }
    K8sTarget:
      oneOf:
        - $ref: '#/components/schemas/K8sTargetCurrent'
        - $ref: '#/components/schemas/K8sTargetProvisioned'
      discriminator:
        propertyName: type
        mapping:
          Current: '#/components/schemas/K8sTargetCurrent'
          Provisioned: '#/components/schemas/K8sTargetProvisioned'
    K8sTargetCurrent:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Current] }
    K8sTargetProvisioned:
      type: object
      required: [type, instanceType, minSize, desiredSize, maxSize, diskSizeGb]
      properties:
        type: { type: string, enum: [Provisioned] }
        instanceType: { type: string }
        minSize: { type: integer }
        desiredSize: { type: integer }
        maxSize: { type: integer }
        diskSizeGb: { type: integer }
    StarRocksClusterSpec:
      type: object
      required: [name, k8sTarget, mode, fe, compute]
      properties:
        name: { type: string }
        k8sTarget:
          $ref: '#/components/schemas/K8sTarget'
        mode:
          type: string
          enum: [SharedData, SharedNothing]
        feImage: { type: string, nullable: true }
        computeImage: { type: string, nullable: true }
        fe:
          $ref: '#/components/schemas/ComponentSpec'
        compute:
          $ref: '#/components/schemas/ComponentSpec'
        computeDiskGb: { type: integer, nullable: true }
        cacheDiskGb:
          type: integer
          nullable: true
          description: >-
            Shared-data only: size in GiB of each CN's cache volume (data cache for external scans
            and the star cache). Server-assigned at creation and immutable; null on clusters
            created before this field existed.
        storage:
          allOf:
            - $ref: '#/components/schemas/StorageSpec'
          nullable: true
        exposeFeService: { type: boolean, description: Ignored; the FE is never exposed outside the cluster. }
        computeAutoscale:
          allOf:
            - $ref: '#/components/schemas/ComputeAutoscaleSpec'
          nullable: true
        idleSuspendMinutes:
          type: integer
          nullable: true
          description: >-
            Scale compute to zero after this many minutes without FE query activity (status
            Suspended); resumes automatically on the next SQL connection. null = never suspend.
    StarRocksClusterInfo:
      type: object
      required: [name, workspace, spec, status, createdAt]
      properties:
        name: { type: string }
        workspace: { type: string }
        spec:
          $ref: '#/components/schemas/StarRocksClusterSpec'
        status:
          type: string
          enum:
            - Creating
            - ProvisioningK8s
            - InstallingOperator
            - DeployingStarRocks
            - Active
            - Degraded
            - Suspended
            - Resuming
            - CreationFailed
            - Deleting
            - DeletionFailed
        statusMessage: { type: string, nullable: true }
        k8sClusterName: { type: string, nullable: true }
        sqlEngineFn: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        serviceAccount: { type: string, nullable: true }
    EnsureEngineCatalogRequest:
      type: object
      required: [workspace, catalog]
      properties:
        workspace: { type: string }
        catalog: { type: string }
        repair: { type: boolean, nullable: true }
        kind: { type: string, nullable: true }
    EngineCatalog:
      type: object
      required: [catalog]
      properties:
        catalog: { type: string }
    ClusterEndpoints:
      type: object
      required: [feMysqlPort]
      properties:
        feMysqlHost: { type: string, nullable: true }
        feMysqlPort: { type: integer }
        feHttpUrl: { type: string, nullable: true }
        sqlEngineFn: { type: string, nullable: true }
    ScaleClusterRequest:
      type: object
      required: [computeReplicas]
      properties:
        computeReplicas: { type: integer }
    UpdateResourcesRequest:
      type: object
      required: [fe, compute]
      properties:
        fe:
          $ref: '#/components/schemas/ComponentSpec'
        compute:
          $ref: '#/components/schemas/ComputeSpecRequest'
        computeAutoscale:
          allOf:
            - $ref: '#/components/schemas/ComputeAutoscaleSpec'
          nullable: true
        idleSuspendMinutes: { type: integer, nullable: true }
    ClusterConnectionDetails:
      type: object
      required: [feHost, feMysqlPort, user, catalog]
      properties:
        feHost: { type: string }
        feMysqlPort: { type: integer }
        user: { type: string }
        password: { type: string, nullable: true }
        catalog: { type: string }
        status:
          type: string
          nullable: true
          description: >-
            Cluster lifecycle status at fetch time. Fetching the details wakes an idle-suspended
            cluster; callers should poll this endpoint until Active before connecting.
        stoppedByUser:
          type: boolean
          nullable: true
          description: Suspended by a user's Stop; connections do not resume it.
    ClusterInstance:
      type: object
      description: One FE/CN/BE pod of a cluster; message carries a waiting reason (e.g. CrashLoopBackOff).
      required: [name, role, phase, ready, restarts]
      properties:
        name: { type: string }
        role:
          type: string
          enum: [fe, cn, be]
        phase: { type: string }
        ready: { type: boolean }
        restarts: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        message: { type: string, nullable: true }
    InstanceLogs:
      type: object
      required: [pod, log]
      properties:
        pod: { type: string }
        log: { type: string }
    InitializeClusterRequest:
      type: object
      description: >-
        Sizing for the workspace's single shared-data cluster (fixed name 'starrocks',
        deployed into the app's own k8s cluster; storage resolved server-side).
      required: [fe, compute]
      properties:
        fe:
          $ref: '#/components/schemas/ComponentSpec'
        compute:
          $ref: '#/components/schemas/ComputeSpecRequest'
        exposeFeService: { type: boolean, description: Ignored; the FE is never exposed outside the cluster. }
        computeAutoscale:
          allOf:
            - $ref: '#/components/schemas/ComputeAutoscaleSpec'
          nullable: true
        idleSuspendMinutes: { type: integer, nullable: true }
        cacheDiskGb:
          type: integer
          nullable: true
          minimum: 5
          maximum: 2000
          description: Per-CN data cache volume in GiB (default 20). Fixed once the cluster is created.
        idempotencyKey:
          type: string
          description: |
            Makes the create idempotent: a retry with the same key and request returns the same cluster (resuming an
            unfinished or failed create), the same key with a different request, or after its cluster was deleted, is
            a 409, and an existing cluster without that key is a 400 with no side effects.
    KafkaRoutineLoadSource:
      type: object
      description: >-
        Kafka source of a routine load job. `properties` entries are rendered as
        `property.<key>` data-source properties (e.g. security.protocol, sasl.mechanism,
        sasl.username, sasl.password).
      required: [brokerList, topic]
      properties:
        brokerList:
          type: string
          description: Comma-separated host:port list, reachable from the StarRocks compute nodes.
        topic: { type: string }
        partitions:
          type: array
          items: { type: integer }
          description: Explicit partition subscription; empty consumes all partitions.
        offsets:
          type: array
          items: { type: string }
          description: >-
            Start position per subscribed partition (parallel to partitions): a numeric offset,
            OFFSET_BEGINNING or OFFSET_END.
        defaultOffsets:
          type: string
          nullable: true
          description: Start position for all partitions (OFFSET_BEGINNING or OFFSET_END).
        properties:
          type: object
          additionalProperties: { type: string }
    TangramKafkaSource:
      type: object
      description: >-
        A topic of the workspace's Tangram-managed Kafka (kafka-operator app). The server resolves
        the token-listener bootstrap and provisions a per-job service account granted read access
        on the topic; its token authenticates the consumer.
      required: [topic]
      properties:
        topic: { type: string }
        defaultOffsets:
          type: string
          nullable: true
          description: OFFSET_BEGINNING, OFFSET_END (default), or a numeric Kafka offset.
    TangramKafkaTopic:
      type: object
      required: [name, rn]
      properties:
        name: { type: string }
        rn: { type: string }
    TangramKafkaTopicList:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TangramKafkaTopic'
    CreateRoutineLoadRequest:
      type: object
      description: >-
        No-SQL description of a CREATE ROUTINE LOAD statement; the server renders and executes
        the SQL against the cluster FE. Exactly one of kafka (external cluster) or tangramKafka
        (the workspace's Tangram-managed Kafka) must be set.
      required: [name, table]
      properties:
        name: { type: string }
        table: { type: string }
        format:
          type: string
          enum: [json, csv, avro]
          default: json
        columns:
          type: array
          items: { type: string }
          description: >-
            Column mapping in source order — plain column names or derivations like
            `event_day = from_unixtime(ts)`. Empty maps by name.
        whereFilter:
          type: string
          nullable: true
          description: Optional row filter expression (WHERE clause).
        targetPartitions:
          type: array
          items: { type: string }
        columnSeparator: { type: string, nullable: true }
        rowDelimiter: { type: string, nullable: true }
        jsonPaths:
          type: array
          items: { type: string }
        jsonRoot: { type: string, nullable: true }
        stripOuterArray: { type: boolean, nullable: true }
        jobProperties:
          type: object
          additionalProperties: { type: string }
          description: >-
            Job PROPERTIES pass-through (desired_concurrent_number, max_batch_interval,
            max_error_number, ...).
        kafka:
          allOf:
            - $ref: '#/components/schemas/KafkaRoutineLoadSource'
          nullable: true
        tangramKafka:
          allOf:
            - $ref: '#/components/schemas/TangramKafkaSource'
          nullable: true
    RoutineLoadSqlPreview:
      type: object
      required: [sql]
      properties:
        sql: { type: string }
    RoutineLoadStatistics:
      type: object
      description: Cumulative counters from the job's Statistic JSON, as reported by SHOW ROUTINE LOAD.
      properties:
        loadedRows: { type: integer, format: int64 }
        errorRows: { type: integer, format: int64 }
        totalRows: { type: integer, format: int64 }
        unselectedRows: { type: integer, format: int64 }
        receivedBytes: { type: integer, format: int64 }
        taskExecuteTimeMs: { type: integer, format: int64 }
        committedTaskNum: { type: integer, format: int64 }
        abortedTaskNum: { type: integer, format: int64 }
        loadRowsRate: { type: integer, format: int64, nullable: true }
        receivedBytesRate: { type: integer, format: int64, nullable: true }
    RoutineLoadInfo:
      type: object
      description: >-
        One routine load job as reported by SHOW ROUTINE LOAD. progress and latestSourcePosition
        map Kafka partition -> consumed/newest offset (values may be symbolic, e.g. OFFSET_ZERO).
      required: [name, database, table, state, dataSourceType]
      properties:
        name: { type: string }
        database: { type: string }
        table: { type: string }
        state:
          type: string
          enum: [NEED_SCHEDULE, RUNNING, PAUSED, UNSTABLE, STOPPED, CANCELLED, UNKNOWN]
        createTime: { type: string, nullable: true }
        pauseTime: { type: string, nullable: true }
        endTime: { type: string, nullable: true }
        dataSourceType: { type: string }
        kafkaTopic: { type: string, nullable: true }
        currentTaskNum: { type: integer, nullable: true }
        jobProperties:
          type: object
          additionalProperties: { type: string }
        dataSourceProperties:
          type: object
          additionalProperties: { type: string }
        customProperties:
          type: object
          additionalProperties: { type: string }
        statistics:
          allOf:
            - $ref: '#/components/schemas/RoutineLoadStatistics'
          nullable: true
        progress:
          type: object
          additionalProperties: { type: string }
        timestampProgress:
          type: object
          additionalProperties: { type: string }
        latestSourcePosition:
          type: object
          additionalProperties: { type: string }
        reasonOfStateChanged: { type: string, nullable: true }
        errorLogUrls: { type: string, nullable: true }
        trackingSql: { type: string, nullable: true }
        otherMsg: { type: string, nullable: true }
    RoutineLoadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutineLoadInfo'
    StarRocksDatabaseList:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items: { type: string }
    StarRocksTableList:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items: { type: string }
    StarRocksTableColumn:
      type: object
      required: [name, dataType, nullable, key]
      properties:
        name: { type: string }
        dataType: { type: string }
        nullable: { type: boolean }
        key: { type: boolean }
        defaultValue: { type: string, nullable: true }
        extra: { type: string, nullable: true }
    StarRocksTableSchema:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/StarRocksTableColumn'
