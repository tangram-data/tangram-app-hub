        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: &id001
