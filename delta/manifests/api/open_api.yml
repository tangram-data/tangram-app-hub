openapi: 3.1.0
info:
  title: Delta Lake catalog (Unity Catalog API)
  version: 1.0.0
paths:
  /api/2.1/unity-catalog/catalogs:
    get:
      tags:
      - UnityCatalog
      summary: List catalogs.
      operationId: listCatalogs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCatalogsResponse'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: &id001
      - httpAuth: []
      parameters:
      - &id002
        name: max_results
        in: query
        required: false
        schema:
          type: integer
      - &id003
        name: page_token
        in: query
        required: false
        schema:
          type: string
  /api/2.1/unity-catalog/catalogs/{name}:
    get:
      tags:
      - UnityCatalog
      summary: Get a catalog.
      operationId: getCatalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogInfo'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
  /api/2.1/unity-catalog/schemas:
    get:
      tags:
      - UnityCatalog
      summary: List schemas.
      operationId: listSchemas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSchemasResponse'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: catalog_name
        in: query
        required: true
        schema:
          type: string
      - *id002
      - *id003
    post:
      tags:
      - UnityCatalog
      summary: Create a schema.
      operationId: createSchema
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Same as the `tangram.idempotency-key` property; the property wins when both are sent.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaInfo'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: >-
            Already exists (ALREADY_EXISTS), or the idempotency key was reused with a different request
            (IDEMPOTENCY_KEY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchema'
  /api/2.1/unity-catalog/schemas/{full_name}:
    get:
      tags:
      - UnityCatalog
      summary: Get a schema.
      operationId: getSchema
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaInfo'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: full_name
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
      - UnityCatalog
      summary: Delete a schema.
      operationId: deleteSchema
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: full_name
        in: path
        required: true
        schema:
          type: string
      - name: force
        in: query
        required: false
        schema:
          type: boolean
  /api/2.1/unity-catalog/tables:
    get:
      tags:
      - UnityCatalog
      summary: List tables.
      operationId: listTables
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResponse'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: catalog_name
        in: query
        required: true
        schema:
          type: string
      - name: schema_name
        in: query
        required: true
        schema:
          type: string
      - *id002
      - *id003
    post:
      tags:
      - UnityCatalog
      summary: Create a table.
      operationId: createTable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableInfo'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTable'
  /api/2.1/unity-catalog/tables/{full_name}:
    get:
      tags:
      - UnityCatalog
      summary: Get a table.
      operationId: getTable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableInfo'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: full_name
        in: path
        required: true
        schema:
          type: string
      - name: read_streaming_table_as_managed
        in: query
        required: false
        schema:
          type: boolean
      - name: read_materialized_view_as_managed
        in: query
        required: false
        schema:
          type: boolean
    delete:
      tags:
      - UnityCatalog
      summary: Delete a table.
      operationId: deleteTable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: full_name
        in: path
        required: true
        schema:
          type: string
  /api/2.1/unity-catalog/tables/{full_name}/stats:
    get:
      tags:
      - UnityCatalog
      summary: The latest snapshot's file layout for maintenance (Tangram extension).
      operationId: getTableStats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableStats'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: full_name
        in: path
        required: true
        schema:
          type: string
  /api/2.1/unity-catalog/tables/{full_name}/history:
    get:
      tags:
      - UnityCatalog
      summary: The table's Delta log commits, newest first (Tangram extension).
      operationId: getTableHistory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableHistory'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      parameters:
      - name: full_name
        in: path
        required: true
        schema:
          type: string
      - name: max_results
        in: query
        required: false
        schema:
          type: integer
      - name: version
        in: query
        required: false
        schema:
          type: integer
          format: int64
  /api/2.1/unity-catalog/staging-tables:
    post:
      tags:
      - UnityCatalog
      summary: Reserve a location for a new table.
      operationId: createStagingTable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagingTableInfo'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStagingTable'
  /api/2.1/unity-catalog/temporary-table-credentials:
    post:
      tags:
      - UnityCatalog
      summary: Temporary credentials for a table.
      operationId: generateTemporaryTableCredentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryCredentials'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTemporaryTableCredential'
  /api/2.1/unity-catalog/temporary-path-credentials:
    post:
      tags:
      - UnityCatalog
      summary: Temporary credentials for a storage path.
      operationId: generateTemporaryPathCredentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryCredentials'
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTemporaryPathCredential'
  /api/2.1/unity-catalog/storage-buckets:
    get:
      tags:
        - UnityCatalog
      summary: List the storage buckets Delta can store a new database in
      operationId: listStorageBuckets
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStorageBucketList'
      security: *id001
    post:
      tags:
        - UnityCatalog
      summary: Create a storage bucket owned by Delta
      operationId: createStorageBucket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppStorageBucket'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStorageBucket'
        '400':
          description: Invalid bucket name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '403':
          description: No privilege
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
        '409':
          description: Bucket already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcError'
      security: *id001
components:
  schemas:
    AppStorageBucket:
      title: AppStorageBucket
      type: object
      required:
        - name
        - owner
        - canCreateFolders
      properties:
        name:
          type: string
        owner:
          type: string
          enum:
            - app
            - workspace
        canCreateFolders:
          type: boolean
    AppStorageBucketList:
      title: AppStorageBucketList
      type: object
      required:
        - canCreateBuckets
        - hiddenCount
        - buckets
      properties:
        canCreateBuckets:
          type: boolean
        hiddenCount:
          type: integer
          format: int32
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AppStorageBucket'
    CreateAppStorageBucket:
      title: CreateAppStorageBucket
      type: object
      required:
        - name
      properties:
        name:
          type: string
    UcError:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
    Empty:
      type: object
    CatalogInfo:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        id:
          type: string
    ListCatalogsResponse:
      type: object
      properties:
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/CatalogInfo'
        next_page_token:
          type: string
    CreateSchema:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        comment:
          type: string
        properties:
          type: object
          description: |
            Schema properties. `volume` names the storage bucket (default: the app's). `tangram.idempotency-key`
            makes the create idempotent (it isn't stored as a property): a retry with the same key and request returns
            the same schema (resuming an unfinished create), the same key with a different request or name, or after
            its schema was dropped, is a 409 IDEMPOTENCY_KEY_CONFLICT, and an existing schema without that key is a 409
            ALREADY_EXISTS before any storage folder is created.
          additionalProperties:
            type: string
      required:
      - name
      - catalog_name
    SchemaInfo:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        full_name:
          type: string
        owner:
          type: string
        created_at:
          type: integer
          format: int64
        created_by:
          type: string
        updated_at:
          type: integer
          format: int64
        schema_id:
          type: string
    ListSchemasResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/SchemaInfo'
        next_page_token:
          type: string
    CreateTable:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        schema_name:
          type: string
        table_type:
          type: string
        data_source_format:
          type: string
        columns:
          type: array
          items: &id004
            type: object
            additionalProperties: true
        storage_location:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
      required:
      - name
      - catalog_name
      - schema_name
    TableStats:
      type: object
      required:
      - version
      - data_files
      - data_bytes
      - small_data_files
      - deletion_vector_files
      - deleted_rows
      - partition_columns
      - clustering_columns
      - truncated
      properties:
        version:
          type: integer
          format: int64
        committed_at:
          type: integer
          format: int64
        data_files:
          type: integer
          format: int64
