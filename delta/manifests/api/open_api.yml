components:
  schemas:
    UcError:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
    Empty:
      type: object
    CatalogInfo:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        id:
          type: string
    ListCatalogsResponse:
      type: object
      properties:
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/CatalogInfo'
        next_page_token:
          type: string
    CreateSchema:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
      required:
      - name
      - catalog_name
    SchemaInfo:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        full_name:
          type: string
        owner:
          type: string
        created_at:
          type: integer
          format: int64
        created_by:
          type: string
        updated_at:
          type: integer
          format: int64
        schema_id:
          type: string
    ListSchemasResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/SchemaInfo'
        next_page_token:
          type: string
    CreateTable:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        schema_name:
          type: string
        table_type:
          type: string
        data_source_format:
          type: string
        columns:
          type: array
          items: &id004
            type: object
            additionalProperties: true
        storage_location:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
      required:
      - name
      - catalog_name
      - schema_name
    TableInfo:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        schema_name:
          type: string
        table_type:
          type: string
        data_source_format:
          type: string
        columns:
          type: array
          items: *id004
        storage_location:
          type: string
        comment:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        owner:
          type: string
        created_at:
          type: integer
          format: int64
        created_by:
          type: string
        updated_at:
          type: integer
          format: int64
        table_id:
          type: string
    ListTablesResponse:
      type: object
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableInfo'
        next_page_token:
          type: string
    CreateStagingTable:
      type: object
      properties:
        name:
          type: string
        catalog_name:
          type: string
        schema_name:
          type: string
      required:
      - name
      - catalog_name
      - schema_name
    StagingTableInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        catalog_name:
          type: string
        schema_name:
          type: string
        staging_location:
          type: string
    GenerateTemporaryTableCredential:
      type: object
      properties:
        table_id:
          type: string
        operation:
          type: string
          enum:
          - READ
          - READ_WRITE
      required:
      - table_id
      - operation
    GenerateTemporaryPathCredential:
      type: object
      properties:
        url:
          type: string
        operation:
          type: string
          enum:
          - PATH_READ
          - PATH_READ_WRITE
          - PATH_CREATE_TABLE
        dry_run:
          type: boolean
      required:
      - url
      - operation
    TemporaryCredentials:
      type: object
      properties:
        aws_temp_credentials:
          type: object
          properties:
            access_key_id:
              type: string
            secret_access_key:
              type: string
            session_token:
              type: string
        azure_user_delegation_sas:
          type: object
          properties:
            sas_token:
              type: string
        gcp_oauth_token:
          type: object
          properties:
            oauth_token:
              type: string
        expiration_time:
          type: integer
          format: int64
        url:
          type: string
        storage_options:
          type: object
          additionalProperties:
            type: string
  securitySchemes:
    httpAuth:
      type: http
      scheme: bearer
