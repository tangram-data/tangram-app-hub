components:
  schemas:
    AppLibType:
      type: string
      enum:
        - Jar
        - PyFile
        - RFile
    AppResourceResponse:
      required:
        - name
        - sparkVersion
        - sparkApplicationType
        - status
        - containerImage
        - createdAt
      type: object
      properties:
        name:
          type: string
        sparkVersion:
          type: string
        sparkApplicationType:
          type: string
        status:
          type: string
        mainApplicationEntry:
          type: string
        containerImage:
          type: string
        createdAt:
          type: string
        driverSpec:
          $ref: '#/components/schemas/SparkDriverSpec'
        executorsSpec:
          $ref: '#/components/schemas/SparkExecutorSpec'
    AppRunsStatsResponse:
      required:
        - lastRunStatus
        - stats
      type: object
      properties:
        lastRunStatus:
          $ref: '#/components/schemas/ApplicationRunStatus'
        stats:
          $ref: '#/components/schemas/Map_Int'
    ApplicationRun:
      required:
        - appName
        - runId
        - clusterName
        - status
        - submittedAt
      type: object
      properties:
        appName:
          type: string
        runId:
          type: string
        clusterName:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationRunStatus'
        submittedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        statusMessage:
          type: string
        additionalSparkConf:
          $ref: '#/components/schemas/Map_String'
    ApplicationRunStatus:
      type: string
      enum:
        - Pending
        - Running
        - Succeeded
        - Failed
        - Cancelled
        - Unknown
    AuthenticationError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorType:
          type: string
    BusinessError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorCode:
          type: string
        errorType:
          type: string
    ClusterNode:
      required:
        - name
        - cpuCores
        - memoryGb
        - storageGb
      type: object
      properties:
        name:
          type: string
        cpuCores:
          type: integer
          format: int32
        memoryGb:
          type: number
          format: double
        storageGb:
          type: number
          format: double
        instanceType:
          type: string
    ClusterStatus:
      type: string
      enum:
        - Creating
        - Active
        - CreationFailed
        - Deleting
        - DeletionFailed
    CreateSparkClusterRequest:
      required:
        - clusterName
        - nodeSize
        - nodeDiskSizeGb
        - initWorkers
        - minWorkers
        - maxWorkers
      type: object
      properties:
        clusterName:
          type: string
        nodeSize:
          $ref: '#/components/schemas/NodeSize'
        nodeDiskSizeGb:
          type: integer
          format: int32
        initWorkers:
          type: integer
          format: int32
        minWorkers:
          type: integer
          format: int32
        maxWorkers:
          type: integer
          format: int32
        masterResources:
          $ref: '#/components/schemas/Resource'
        workerResources:
          $ref: '#/components/schemas/Resource'
    GitInfo:
      required:
        - repo
        - branch
      type: object
      properties:
        repo:
          type: string
        branch:
          type: string
        commitHash:
          type: string
    LibUploadBody:
      required:
        - file
      type: object
      properties:
        file:
          type: string
          format: binary
    Map_Int:
      type: object
      additionalProperties:
        type: integer
        format: int32
    Map_String:
      type: object
      additionalProperties:
        type: string
    NodeSize:
      type: string
      enum:
        - XS
        - S
        - M
        - L
        - XL
        - XXL
    NotFoundError:
      required:
        - resourceType
        - id
        - errorType
      type: object
      properties:
        resourceType:
          type: string
        id:
          type: string
        errorType:
          type: string
        errorMessage:
          type: string
    Resource:
      required:
        - requests
        - limits
      type: object
      properties:
        requests:
          $ref: '#/components/schemas/ResourceSpec'
        limits:
          $ref: '#/components/schemas/ResourceSpec'
    ResourceSpec:
      required:
        - cpu
        - memory
      type: object
      properties:
        cpu:
          type: string
        memory:
          type: string
    RunAppRequest:
      required:
        - clusterName
      type: object
      properties:
        clusterName:
          type: string
        additionalSparkConf:
          $ref: '#/components/schemas/Map_String'
    SparkApplicationLib:
      required:
        - name
        - version
        - fileName
        - libType
        - createdAt
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        fileName:
          type: string
        libType:
          $ref: '#/components/schemas/AppLibType'
        createdAt:
          type: string
          format: date-time
        gitInfo:
          $ref: '#/components/schemas/GitInfo'
    SparkApplicationSpec:
      required:
        - name
        - sparkVersion
        - containerImage
        - driverSpec
        - executorsSpec
        - sparkConf
      type: object
      properties:
        name:
          type: string
        sparkVersion:
          type: string
        sparkApplicationType:
          type: string
        jars:
          type: array
          items:
            type: string
        pyFiles:
          type: array
          items:
            type: string
        sparkRFiles:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: string
        containerImage:
          type: string
        driverSpec:
          $ref: '#/components/schemas/SparkDriverSpec'
        executorsSpec:
          $ref: '#/components/schemas/SparkExecutorSpec'
        mainApplicationEntry:
          type: string
        mainArgs:
          type: array
          items:
            type: string
        sparkConf:
          $ref: '#/components/schemas/Map_String'
    SparkCluster:
      required:
        - name
        - nodeSize
        - nodeDiskSizeGb
        - initWorkers
        - minWorkers
        - maxWorkers
        - status
        - createdAt
      type: object
      properties:
        name:
          type: string
        nodeSize:
          $ref: '#/components/schemas/NodeSize'
        nodeDiskSizeGb:
          type: integer
          format: int32
        initWorkers:
          type: integer
          format: int32
        minWorkers:
          type: integer
          format: int32
        maxWorkers:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ClusterStatus'
        createdAt:
          type: string
          format: date-time
        statusMessage:
          type: string
    SparkDriverSpec:
      required:
        - cores
      type: object
      properties:
        cores:
          type: integer
          format: int32
        memory:
          type: string
        disk:
          type: string
    SparkExecutorSpec:
      required:
        - instances
        - cores
      type: object
      properties:
        instances:
          type: integer
          format: int32
        cores:
          type: integer
          format: int32
        memory:
          type: string
        disk:
          type: string
    SparkLogEntry:
      required:
        - timestamp
        - log
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        log:
          type: string
        containerName:
          type: string
    SparkRunLogsResponse:
      required:
        - numHits
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/SparkLogEntry'
        numHits:
          type: integer
          format: int64
    TechnicalError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorStack:
          type: string
        errorType:
          type: string
    UnauthorizedError:
      required:
        - message
        - errorType
      type: object
      properties:
        message:
          type: string
        errorType:
          type: string
