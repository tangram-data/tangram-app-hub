openapi: 3.0.3
info:
  title: Spark Service
  version: 1.0.0
paths:
  /api/v1/clusters:
    post:
      operationId: initializeSparkCluster
      tags: [SparkService]
      summary: >-
        Create a Spark cluster asynchronously; poll GET /clusters/{name} for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeClusterRequest'
      responses:
        '200':
          description: Cluster record in status Creating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkClusterInfo'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listSparkClusters
      tags: [SparkService]
      summary: List the workspace's Spark clusters.
      responses:
        '200':
          description: Clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SparkClusterInfo'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}:
    get:
      operationId: getSparkCluster
      tags: [SparkService]
      summary: Get the Spark cluster by name, including its lifecycle status (404 when absent).
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Cluster record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkClusterInfo'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSparkCluster
      tags: [SparkService]
      summary: Decommission the Spark cluster asynchronously (driver, executors, service account).
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Deletion started
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/resources:
    post:
      operationId: configureSparkCluster
      tags: [SparkService]
      summary: Update driver resources, executor sizing and Spark settings of an active cluster; the driver is rolled.
      parameters:
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourcesRequest'
      responses:
        '200':
          description: Update applied
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/stop:
    post:
      operationId: stopSparkCluster
      tags: [SparkService]
      summary: Stop the cluster; the driver goes to zero replicas and its pods stop. Start it again later.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Stopped
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/start:
    post:
      operationId: startSparkCluster
      tags: [SparkService]
      summary: Start a stopped cluster asynchronously; poll GET /clusters/{name} until Active.
      parameters:
        - $ref: '#/components/parameters/name'
        - name: onlyIfAutoStopped
          in: query
          description: Start only a cluster that auto-stop stopped (the SQL proxy waking an idle cluster).
          schema:
            type: boolean
      responses:
        '200':
          description: Start requested
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/auto-stop:
    post:
      operationId: configureSparkClusterAutoStop
      tags: [SparkService]
      summary: Turn auto-stop on (idle minutes without Spark jobs) or off; the driver is not restarted.
      parameters:
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutoStopRequest'
      responses:
        '200':
          description: Auto-stop updated
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/endpoints:
    get:
      operationId: getSparkClusterEndpoints
      tags: [SparkService]
      summary: Spark Connect URL, proxied Spark UI path and the cluster's service account.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterEndpoints'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/connection-details:
    get:
      operationId: getSparkClusterConnectionDetails
      tags: [SparkService]
      summary: Spark Connect host/port for the SQL proxy (GetConnectionDetails action).
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConnectionDetails'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances:
    get:
      operationId: getSparkClusterInstances
      tags: [SparkService]
      summary: Status of the cluster's driver and executor pods.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Pods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterInstance'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{name}/instances/{pod}/logs:
    get:
      operationId: getSparkClusterInstanceLogs
      tags: [SparkService]
      summary: Tail of one driver/executor pod's logs (default 500 lines, capped at 5000).
      parameters:
        - $ref: '#/components/parameters/name'
        - name: pod
          in: path
          required: true
          schema:
            type: string
        - name: tailLines
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Log tail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceLogs'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications:
    post:
      operationId: createSparkApplication
      tags: [SparkService]
      summary: Create a PySpark application (a Tangram folder for its files and a service account for its runs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SparkApplicationSpec'
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkApplication'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listSparkApplications
      tags: [SparkService]
      summary: List the workspace's PySpark applications.
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SparkApplication'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}:
    get:
      operationId: getSparkApplication
      tags: [SparkService]
      summary: Get an application.
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkApplication'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSparkApplication
      tags: [SparkService]
      summary: Replace an application's spec (the name is fixed); the next run uses it, active runs keep theirs.
      parameters:
        - $ref: '#/components/parameters/app'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SparkApplicationSpec'
      responses:
        '200':
          description: The updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkApplication'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSparkApplication
      tags: [SparkService]
      summary: Delete an application, its files and its service account (refused while a run is active).
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs:
    get:
      operationId: listSparkApplicationLibs
      tags: [SparkService]
      summary: All uploaded lib versions of an application.
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: Libs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SparkAppLib'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs/{lib}:
    delete:
      operationId: deleteSparkApplicationLib
      tags: [SparkService]
      summary: Delete every version of a lib.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
      responses:
        '200':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs/{lib}/versions/{version}:
    post:
      operationId: uploadSparkApplicationLib
      tags: [SparkService]
      summary: Upload a new version of a lib (versions are MAJOR.MINOR.PATCH and only increase).
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
        - $ref: '#/components/parameters/version'
        - name: libType
          in: query
          required: true
          schema:
            type: string
            enum: [Jar, PyFile, PyArchive, File]
        - name: gitRepo
          in: query
          schema:
            type: string
        - name: gitBranch
          in: query
          schema:
            type: string
        - name: gitCommit
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The stored lib version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkAppLib'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSparkApplicationLibVersion
      tags: [SparkService]
      summary: Delete one version of a lib.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/libs/{lib}/versions/{version}/content:
    get:
      operationId: getSparkApplicationLibContent
      tags: [SparkService]
      summary: A text lib version's content for preview (source and config files up to 16 MiB, first 1 MiB).
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/lib'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: The file's content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibContent'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs:
    post:
      operationId: runSparkApplication
      tags: [SparkService]
      summary: Submit a run of the application's latest libs as a Kubernetes Job.
      parameters:
        - $ref: '#/components/parameters/app'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: The submitted run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkRun'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listSparkApplicationRuns
      tags: [SparkService]
      summary: Runs of an application, newest first (default 50).
      parameters:
        - $ref: '#/components/parameters/app'
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SparkRun'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/stats:
    get:
      operationId: getSparkApplicationRunStats
      tags: [SparkService]
      summary: Run counts by status and the latest run's status.
      parameters:
        - $ref: '#/components/parameters/app'
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStats'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}:
    get:
      operationId: getSparkApplicationRun
      tags: [SparkService]
      summary: Get a run.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkRun'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}/status:
    get:
      operationId: getSparkApplicationRunStatus
      tags: [SparkService]
      summary: Status of a run.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatus'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}/cancel:
    post:
      operationId: cancelSparkApplicationRun
      tags: [SparkService]
      summary: Cancel a pending or running run.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Cancelled
        default:
          $ref: '#/components/responses/Error'
  /api/v1/applications/{app}/runs/{runId}/logs:
    get:
      operationId: getSparkApplicationRunLogs
      tags: [SparkService]
      summary: Logs of a run's pods from the platform log pipeline.
      parameters:
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/runId'
        - name: component
          in: query
          description: run (the driver pod) or run-executor
          schema:
            type: string
        - name: startTimestamp
          in: query
          description: epoch seconds
          schema:
            type: integer
            format: int64
        - name: endTimestamp
          in: query
          description: epoch seconds
          schema:
            type: integer
            format: int64
        - name: maxHits
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLogs'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    app:
      name: app
      in: path
      required: true
      schema:
        type: string
    lib:
      name: lib
      in: path
      required: true
      schema:
        type: string
    version:
      name: version
      in: path
      required: true
      schema:
        type: string
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Service error
      content:
        application/json:
          schema:
            type: object
  schemas:
    PodResources:
      type: object
      required: [cpuMilli, memoryMi]
      properties:
        cpuMilli:
          type: integer
        memoryMi:
          type: integer
    ExecutorSpec:
      type: object
      required: [maxCount, resources]
      properties:
        maxCount:
          type: integer
          description: Maximum executor pods requested on demand (dynamic allocation); idle executors are released.
        resources:
          $ref: '#/components/schemas/PodResources'
        cores:
          type: integer
          default: 1
          description: Concurrent tasks per executor.
        idleSeconds:
          type: integer
          default: 60
    SparkConf:
      type: object
      description: Spark settings layered under the managed ones (Kubernetes wiring, driver networking, pod memory settings and the iceberg catalog are reserved).
      additionalProperties:
        type: string
    SparkClusterSpec:
      type: object
      required: [name, driver, executor]
      properties:
        name:
          type: string
        driver:
          $ref: '#/components/schemas/PodResources'
        executor:
          $ref: '#/components/schemas/ExecutorSpec'
        sparkConf:
          $ref: '#/components/schemas/SparkConf'
        autoStop:
          $ref: '#/components/schemas/AutoStopSpec'
        image:
          type: string
          nullable: true
    SparkClusterInfo:
      type: object
      required: [name, workspace, spec, status, createdAt]
      properties:
        name:
          type: string
        workspace:
          type: string
        spec:
          $ref: '#/components/schemas/SparkClusterSpec'
        status:
          type: string
          enum: [Creating, DeployingSpark, Active, Degraded, Stopped, Starting, CreationFailed, Deleting, DeletionFailed]
        statusMessage:
          type: string
          nullable: true
        serviceAccount:
          type: string
          nullable: true
          description: Tangram service account the cluster runs as; admins grant it Iceberg data roles.
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Last activity seen by the manager (Active clusters only).
    InitializeClusterRequest:
      type: object
      required: [name, driver, executor]
      properties:
        name:
          type: string
          description: DNS-1035 label (lowercase, starts with a letter), at most 40 characters, unique in the workspace; must not contain '-driver' or '-exec'.
        driver:
          $ref: '#/components/schemas/PodResources'
        executor:
          $ref: '#/components/schemas/ExecutorSpec'
        sparkConf:
          $ref: '#/components/schemas/SparkConf'
        autoStop:
          $ref: '#/components/schemas/AutoStopSpec'
    AutoStopSpec:
      type: object
      required: [idleMinutes]
      properties:
        idleMinutes:
          type: integer
          description: Stop the cluster after this many minutes without Spark jobs (5 to 10080).
    UpdateAutoStopRequest:
      type: object
      properties:
        autoStop:
          allOf:
            - $ref: '#/components/schemas/AutoStopSpec'
          nullable: true
          description: Absent or null turns auto-stop off.
    UpdateResourcesRequest:
      type: object
      required: [driver, executor]
      properties:
        driver:
          $ref: '#/components/schemas/PodResources'
        executor:
          $ref: '#/components/schemas/ExecutorSpec'
        sparkConf:
          $ref: '#/components/schemas/SparkConf'
    ClusterEndpoints:
      type: object
      required: [connectUrl, connectHost, connectPort, sparkUiPath]
      properties:
        connectUrl:
          type: string
          description: Spark Connect URL (sc://host:15002), reachable inside the Kubernetes cluster only.
        connectHost:
          type: string
        connectPort:
          type: integer
        sparkUiPath:
          type: string
          description: Live Spark UI of the driver, proxied by this app (relative to the app base path).
        serviceAccount:
          type: string
          nullable: true
    ClusterConnectionDetails:
      type: object
      required: [host, connectPort, catalog]
      properties:
        host:
          type: string
        connectPort:
          type: integer
        catalog:
          type: string
        status:
          type: string
          nullable: true
        statusMessage:
          type: string
          nullable: true
        autoStopped:
          type: boolean
          description: Stopped for idleness; the SQL proxy starts such a cluster on demand.
        serviceAccountTokenFile:
          type: string
          nullable: true
          description: Path of the cluster's service-account token file inside the driver; catalogs the SQL proxy attaches use it.
    ClusterInstance:
      type: object
      required: [name, role, phase, ready, restarts]
      properties:
        name:
          type: string
        role:
          type: string
        phase:
          type: string
        ready:
          type: boolean
        restarts:
          type: integer
        startedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true
    InstanceLogs:
      type: object
      required: [pod, log]
      properties:
        pod:
          type: string
        log:
          type: string
    LibType:
      type: string
      enum: [Jar, PyFile, PyArchive, File]
    RunStatus:
      type: string
      enum: [Pending, Running, Succeeded, Failed, Cancelled]
    SparkApplicationSpec:
      type: object
      required: [name, mainFile]
      properties:
        name:
          type: string
        mainFile:
          type: string
          description: File name of one of the application's Jar or PyFile libs
        mainClass:
          type: string
          description: Entry class of a JAR without a Main-Class manifest
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        sparkConf:
          $ref: '#/components/schemas/SparkConf'
        driver:
          $ref: '#/components/schemas/PodResources'
        executor:
          $ref: '#/components/schemas/ExecutorSpec'
        maxDurationMinutes:
          type: integer
        description:
          type: string
        serviceAccountToken:
          $ref: '#/components/schemas/ServiceAccountTokenSpec'
        streaming:
          type: boolean
          default: false
          description: >-
            Streaming job: runs checkpoint under <app folder>/checkpoints/<queryName> by default and only one
            run is active at a time.
    ServiceAccountTokenSpec:
      type: object
      description: >-
        How runs receive the application's service-account token. Omitted, the defaults apply: file
        service-account-token and env var TANGRAM_SERVICE_ACCOUNT_TOKEN. Runs always get
        TANGRAM_SERVICE_ACCOUNT_TOKEN_FILE with the file's path.
      properties:
        fileName:
          type: string
          default: service-account-token
          description: File name in the run directory /var/run/spark/run/ (letters, digits, '.', '_', '-').
        envVar:
          type: string
          nullable: true
          description: Env var holding the token itself; null for none.
    SparkApplication:
      type: object
      required: [name, workspace, spec, folder, createdAt]
      properties:
        name:
          type: string
        workspace:
          type: string
        spec:
          $ref: '#/components/schemas/SparkApplicationSpec'
        serviceAccount:
          type: string
        folder:
          type: string
        createdAt:
          type: string
          format: date-time
    LibContent:
      type: object
      required: [content, truncated, sizeBytes]
      properties:
        content:
          type: string
        truncated:
          type: boolean
          description: The file is larger than the 1 MiB preview cap; content is its first part.
        sizeBytes:
          type: integer
          format: int64
    SparkAppLib:
      type: object
      required: [name, version, fileName, libType, sizeBytes, createdAt]
      properties:
        name:
          type: string
        version:
          type: string
        fileName:
          type: string
        libType:
          $ref: '#/components/schemas/LibType'
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        gitRepo:
          type: string
        gitBranch:
          type: string
        gitCommit:
          type: string
    RunRequest:
      type: object
      properties:
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        sparkConf:
          $ref: '#/components/schemas/SparkConf'
        executor:
          $ref: '#/components/schemas/ExecutorSpec'
    RunLib:
      type: object
      required: [name, version, fileName, libType]
      properties:
        name:
          type: string
        version:
          type: string
        fileName:
          type: string
        libType:
          $ref: '#/components/schemas/LibType'
    SparkRunSpec:
      type: object
      required: [mainFile, args, sparkConf, env, driver, maxDurationMinutes, libs, image]
      properties:
        mainFile:
          type: string
        mainClass:
          type: string
        sparkConf:
          $ref: '#/components/schemas/SparkConf'
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        driver:
          $ref: '#/components/schemas/PodResources'
        executor:
          $ref: '#/components/schemas/ExecutorSpec'
        maxDurationMinutes:
          type: integer
        libs:
          type: array
          items:
            $ref: '#/components/schemas/RunLib'
        image:
          type: string
        serviceAccountToken:
          $ref: '#/components/schemas/ServiceAccountTokenSpec'
        appFolder:
          type: string
        streaming:
          type: boolean
    SparkRun:
      type: object
      required: [appName, runId, status, spec, submittedAt]
      properties:
        appName:
          type: string
        runId:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        spec:
          $ref: '#/components/schemas/SparkRunSpec'
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
